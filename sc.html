/* ---------- 朗讀、複製、提示 ---------- */
function stopSpeak(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} S.speaking=-1; }
function speak(i){
 if(S.speaking===i){ stopSpeak(); render(); return; }
 stopSpeak();
 var t=plain(S.chat[i].t).replace(/[（(][^）)]*\d+[:：]\d+[^）)]*[）)]/g,'').replace(/[・]/g,'').replace(/[\uD83C-\uD83E][\uDC00-\uDFFF]|[☀-➿️‍]/g,'');
 var parts=t.match(/[^。！？!?\n]+[。！？!?]?/g)||[t]; var left=parts.length;
 S.speaking=i; render();
 for(var k=0;k<parts.length;k++){
  var u=new SpeechSynthesisUtterance(parts[k]); u.lang=LANG==='en'?'en-US':(LANG==='zs'?'zh-CN':'zh-TW'); u.rate=.95;
  u.onend=u.onerror=function(){ left--; if(left<=0&&S.speaking===i){ S.speaking=-1; render(); } };
  speechSynthesis.speak(u);
 }
}
function toast(s){ var o=document.querySelectorAll('.toast'); for(var oi=0;oi<o.length;oi++) o[oi].parentNode.removeChild(o[oi]); var t=document.createElement('div'); t.className='toast'; t.textContent=s; document.body.appendChild(t); setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); },2200); }
function copyText(s,msg){
 function fallback(){ var ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=false; try{ok=document.execCommand('copy');}catch(e){} document.body.removeChild(ta); toast(ok?msg:T('copyFail')); }
 try{ navigator.clipboard.writeText(s).then(function(){toast(msg);},fallback); }catch(e){ fallback(); }
}
function shareOut(s){ if(navigator.share){ navigator.share({title:T('shareTitle'),text:s}).catch(function(err){ if(!err||err.name!=='AbortError') copyText(s,T('copiedShare')); }); } else copyText(s,T('copiedShare')); }
function qOf(i){ for(var j=i-1;j>=0;j--) if(S.chat[j].role==='user') return S.chat[j].t; return ''; }
function shareText(q,t){ return (q?T('qPrefix')+q+'\n\n':'')+plain(t)+'\n\n'+T('shareSign'); }
function setLang(v){
 if(v===LANG||LANGS.indexOf(v)<0) return;
 if(S.ctl) S.ctl.abort(); stopSpeak();
 LANG=v; lsSet('lang',v); S.cat=-1; S.firstNew=null; loadChat(); foldOld(S.chat.length-1); render();
 var sc=$('scroll'); sc.scrollTop=S.chat.length?sc.scrollHeight:0;
 toast(T('langDone'));
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
 var b=e.target.closest?e.target.closest('[data-act]'):null;
 if(!b){ if(e.target.id==='sheetmask') closeSheet(); return; }
 var a=b.getAttribute('data-act'),i=parseInt(b.getAttribute('data-i'),10),v=b.getAttribute('data-v'),fid=b.getAttribute('data-id'),f;
 if(a==='send'){ if(S.busy){ if(S.ctl) S.ctl.abort(); } else send($('q').value); }
 else if(a==='ask') send(b.getAttribute('data-q'));
 else if(a==='cat'){ S.cat=i; S.bankQ=''; var bq=$('bankq'); if(bq) bq.value=''; var bb=$('bankbody'); if(bb){ bb.innerHTML=bankBody(); var sh0=document.querySelector('#sheetmask .sheet'); if(sh0) sh0.scrollTop=0; } else render(); }
 else if(a==='moreq') moreQ();
 else if(a==='lang') setLang(v);
 else if(a==='aud'){ if(v===X.aud()) return; X.setAud(v); S.cat=-1; render(); toast(T('audSet')+X.AUD_ICON[v]+' '+X.audName(v)); }
 else if(a==='bg'){ if(v===X.skbg()) return; X.setBg(v); render(); if(!reAnswerLast(T('bgRe',X.skName(v)))) toast(T('bgSet',X.skName(v))); }
 else if(a==='len'){ if(v===X.alen()){ if(S.sheet==='lenmenu') closeSheet(); return; } X.setLen(v); if(S.sheet==='lenmenu') closeSheet(); render(); if(!reAnswerLast(T('lenRe',X.lenName(v)))) toast(T('lenSet',X.lenName(v),T(LEN_SUB_K[v]))); }
 else if(a==='fs'){ S.fs=parseInt(v,10); lsSet('fs',S.fs); render(); }
 else if(a==='profile'){ closeSheet(); closeDrawer(); X.openProfile(function(){ render(); }); }
 else if(a==='bank'){ closeDrawer(); S.cat=-2; S.bankQ=''; openSheet('bank'); }
 else if(a==='lenmenu') openSheet('lenmenu');
 else if(a==='meet') openSheet('meet');
 else if(a==='cpy') copyText(v,T('copied2'));
 else if(a==='drawer') openDrawer();
 else if(a==='drawerclose') closeDrawer();
 else if(a==='conv'){ goView(fid); }
 else if(a==='back') goBack();
 else if(a==='home') goView('home');
 else if(a==='convdel'){ if(S.delArm!==fid){ S.delArm=fid; $('clist').innerHTML=convListHTML(); return; } S.delArm=''; delConv(fid); render(); toast(T('convDeleted')); }
 else if(a==='sugmore'){ S.sugBatch=(S.sugBatch||0)+1; render(); }
 else if(a==='favs'){ closeDrawer(); S.favQ=''; openSheet('favs'); }
 else if(a==='settings'){ closeDrawer(); openSheet('settings'); }
 else if(a==='close') closeSheet();
 else if(a==='newchat'){ goView('home'); setTimeout(function(){ try{$('q').focus();}catch(e){} },50); }
 else if(a==='clear'){ if(!S.clearArm){ S.clearArm=true; renderSheet(); return; } newChat(); CONVS=[]; persistConvs(); closeSheet(); render(); toast(T('cleared')); }
 else if(a==='fold'){ var m=S.chat[i]; m.fold=!m.fold; save(); var el=$('m'+i); el.classList.toggle('fold',m.fold); b.textContent=m.fold?T('foldMore'):T('foldLess'); if(m.fold) el.scrollIntoView({block:'nearest'}); }
 else if(a==='fav') toggleFav(i);
 else if(a==='speak') speak(i);
 else if(a==='copy') copyText(plain(S.chat[i].t),T('copied'));
 else if(a==='share') shareOut(shareText(qOf(i),S.chat[i].t));
 else if(a==='del'){ if(S.busy) return; stopSpeak(); var from=i; while(from>0&&S.chat[from-1].crisis) from--; if(from>0) from--; S.chat.splice(from,i-from+1); save(); render(); toast(T('deleted')); }
 else if(a==='retry'){ if(S.busy) return; reAnswerLast(T('retry')); }
 else if(a==='updcheck'){ toast(T('updChecking')); window.XZUPD.check(function(r){ toast(r==='latest'?T('upToDate'):(r==='err'?T('netErr'):T('updating'))); }); }
 else if(a==='updhard'){ toast(T('updating')); window.XZUPD.hard(); }
 else if(a==='favtoggle'){ S.favOpen[fid]=!S.favOpen[fid]; $('favlist').innerHTML=favListHTML(); }
 else if(a==='favcopy'){ f=favById(fid); if(f) copyText(plain(f.t),T('copied')); }
 else if(a==='favshare'){ f=favById(fid); if(f) shareOut(shareText(f.q,f.t)); }
 else if(a==='favask'){ f=favById(fid); if(f){ closeSheet(); send(f.q); } }
 else if(a==='favdel'){ for(var k=0;k<FAV.length;k++) if(FAV[k].id===fid){ FAV.splice(k,1); break; } saveFav(); renderSheet(); render(); toast(T('unfaved')); }
});
var qEl=$('q');
function autosize(){ qEl.style.height='auto'; qEl.style.height=Math.min(qEl.scrollHeight,200)+'px'; }
qEl.addEventListener('input',autosize);
qEl.addEventListener('keydown',function(e){
 var touch=('ontouchstart' in window)&&window.innerWidth<820;
 if(e.key==='Enter'&&!e.shiftKey&&!touch&&!e.isComposing&&e.keyCode!==229){ e.preventDefault(); send(qEl.value); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(S.sheet) closeSheet(); else if(S.drawer) closeDrawer(); } });

foldOld(S.chat.length-1); render();
if(S.chat.length){ var sc=$('scroll'); sc.scrollTop=sc.scrollHeight; }
(function(){ for(var j=S.chat.length-1;j>=0;j--){ var c=S.chat[j]; if(c.role==='ai'&&!c.crisis){ if(c.ok&&!c.err&&!c.fu) genFU(j); break; } } })();
})();

<script>
(function(){
var APPVER='v2026.1111.1435',PFX='xiaozhi321-';window.APPVER=APPVER;
if(location.search.indexOf('u=')>=0) try{history.replaceState(null,'',location.pathname+location.hash);}catch(e){}
var reg=null,pending=null;
function lsG(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function lsS(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function zh(){var l=document.documentElement.lang||'';return /^en/.test(l)?2:(/Hans/.test(l)?1:0);}
function L(a,b,c){return [a,b,c][zh()];}
function busy(){var s=document.getElementById('send'),q=document.getElementById('q');return !!((s&&s.classList.contains('stop'))||(q&&q.value.trim())||document.getElementById('sheetmask')||document.getElementById('xz2pf'));}
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){reg=r;try{r.update();}catch(e){}}).catch(function(){});
}
function go(){location.replace(location.pathname+'?u='+Date.now()+location.hash);}
function hard(){
 var done=false;function fin(){if(!done){done=true;go();}}
 var p=[];
 try{if(window.caches)p.push(caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf(PFX)===0;}).map(function(k){return caches.delete(k);}));}));}catch(e){}
 try{if(reg)p.push(reg.unregister());}catch(e){}
 Promise.all(p).then(fin,fin);setTimeout(fin,2000);
}
function bar(v){
 if(document.getElementById('updbar'))return;
 var b=document.createElement('button');b.id='updbar';b.type='button';
 b.textContent=L('🔄 有新版本，點這裡更新','🔄 有新版本，点这里更新','🔄 New version available, tap to update');
 b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:100001;background:#1E3F8F;color:#fff;border:0;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.28);font:600 15px/1.3 system-ui,sans-serif;white-space:nowrap';
 b.onclick=function(){b.textContent=L('正在更新…','正在更新…','Updating…');hard();};
 document.body.appendChild(b);
}
function apply(v){
 var raw=lsG('xzupd_try').split('|'),n=1,now=Date.now();
 if(raw[0]===v&&now-(+raw[2]||0)<10*60*1000)n=(+raw[1]||0)+1;
 lsS('xzupd_try',v+'|'+n+'|'+(n===1?now:(+raw[2]||now)));
 if(n===1){try{if(reg&&reg.waiting)reg.waiting.postMessage('skip');if(reg)reg.update();}catch(e){}setTimeout(go,700);}
 else if(n===2){hard();}
 else{bar(v);}
}
function check(cb){
 var x=new XMLHttpRequest();x.open('GET','version.json?t='+Date.now(),true);
 try{x.setRequestHeader('Cache-Control','no-cache');}catch(e){}
 x.timeout=12000;
 x.onload=function(){
  var v='';try{v=JSON.parse(x.responseText).v||'';}catch(e){}
  if(!v){if(cb)cb('err');return;}
  if(v===APPVER){pending=null;var ub=document.getElementById('updbar');if(ub)ub.remove();if(cb)cb('latest');return;}
  pending=v;try{if(reg)reg.update();}catch(e){}
  if(cb){cb('new');apply(v);return;}
  if(busy())bar(v);else apply(v);
 };
 x.onerror=x.ontimeout=function(){if(cb)cb('err');};
 x.send();
}
setTimeout(function(){check();},2500);
setInterval(function(){check();},15*60*1000);
setInterval(function(){if(pending&&!busy())apply(pending);},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
window.addEventListener('pageshow',function(e){if(e.persisted)check();});
window.addEventListener('online',function(){check();});
window.XZUPD={ver:APPVER,check:check,hard:hard};
})();
</script>
