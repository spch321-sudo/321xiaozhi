ghan na kog nabuhat nga sayop. Dawaton pa ba ko sa Dios?", "Unsay kalainan sa pagtuo kang Jesus ug sa ubang relihiyon o sa pagkamaayong tawo lang?", "Unsay buot ipasabot sa pagkatawo pag-usab?", "Unsa ang unang lakang human motuo kang Jesus?", "Unsaon pagpasabot sa Maayong Balita sa higala sa yano nga pulong?"]], ["✝️", "Sukaranan sa pagtuo", ["Tinuod ba nga adunay Dios? Unsay rason sa pagtuo?", "Unsaon pagsabot sa Trinidad gamit ang yano nga panig-ingnan?", "Nganong kinahanglang mamatay si Jesus sa krus?", "Makasulod ba sa langit ang maayong tawo? Nganong kinahanglan pa si Jesus?", "Kon gugma ang Dios, nganong adunay pag-antos sa kalibutan?", "Kinsa ang Balaang Espiritu, ug unsaon nako pagkahibalo nga siya nagagiya kanako?", "Unsay buot ipasabot sa \"gipakamatarong pinaagi sa pagtuo\"?", "Nakasala pa ba ang mga Kristohanon? Mawala ba ang kaluwasan?", "Unsa ang mga ebidensya sa kasaysayan sa pagkabanhaw ni Jesus?", "Tinuod ba ang langit ug impyerno?", "Nganong kinahanglan magpabawtismo? Unsay kahulogan sa bawtismo?", "Unsa ang kahulogan sa Panihapon sa Ginoo?"]], ["📖", "Giya sa Bibliya", ["Unang higayon nako sa pagbasa sa Bibliya. Asa nga libro ko magsugod?", "Unsa ang kalabotan sa Daang Kasabotan ug Bag-ong Kasabotan?", "Ipaila kanako ang Ebanghelyo ni Juan sulod sa lima ka minuto.", "Unsay gisulti sa Salmo 23 ug unsaon kini pamalandungan?", "Unsay kahulogan sa mga Pagpanalangin sa Wali sa Bukid?", "Unsaon pagbasa sa Pinadayag nga dili maglibog?", "Unsay sulod sa matag usa sa lima ka libro ni Moises?", "Unsaon pagbasa sa Mga Proverbio nga labing makatabang?", "Unsa ang tema sa Mga Taga-Roma?", "Lisod sabton ang mga propeta. Asa ko magsugod?", "Nganong upat ang Ebanghelyo, ug unsay ilang kalainan?", "Unsaon pagbasa sa tibuok Bibliya sulod sa usa ka tuig?"]], ["🌱", "Espirituhanong pagtubo", ["Unsa ang \"daang pagkatawo nga nakasentro sa kaugalingon\", ug unsaon nako kini pagkakita sa akong kaugalingon?", "Unsay kalainan sa pagpaubos ug sa ubos nga pagtan-aw sa kaugalingon?", "Unsa ang dagway sa \"paghimo kang Jesus nga Hari\"?", "Kanunay mapugngan ang akong debosyon. Unsay akong buhaton?", "Kanunay kong mapandol sa samang kahuyang. Unsaon nako pagdaog?", "Unsaon pag-ila sa giya sa Balaang Espiritu ug sa akong kaugalingong hunahuna?", "Unsaon pagtukod og batasan sa adlaw-adlaw nga pag-ampo?", "Unsa ang bunga sa Espiritu ug unsaon kini pagtubo?", "Unsay buhaton kon huyang ang pagtuo ug nagduhaduha sa Dios?", "Unsaon pagbangon gikan sa kapakyasan ug himoong kadaogan ang kapildihan?", "Unsay buot ipasabot sa paglimod sa kaugalingon ug pagkawalay kaugalingon?", "Unsaon pagpangita sa tawag sa Dios ug sa akong mga gasa?"]], ["💑", "Kaminyoon ug pamilya", ["Kanunay mi mag-away sa gagmay nga butang. Unsaon pagbungkag niini nga siklo?", "Wala pa motuo ang akong kapikas. Unsaon nako pagpakita sa akong pagtuo sa balay?", "Unsaon pagpakigsabot og maayo sa mga ugangan?", "Human sa dugay nga kaminyoon, mibugnaw ang gugma. Unsaon kini pagpasiga pag-usab?", "Lahi ang among panglantaw sa kwarta. Unsaon kini pag-uyon?", "Unsang importanteng butang ang angay hisgotan una magminyo?", "Unsaon pagpakita og gugma sa paagi nga masabtan sa akong kapikas?", "Kon dili mag-istoryahanay, kinsa ang mosulti una ug unsaon?", "Unsaon sa magtiayon pagbasa sa Bibliya ug pag-ampo nga duha?", "Unsaon pagpabilin og panahon alang sa usag usa bisan busy?", "Adunay timailhan nga basin naay laing gihigugma ang akong kapikas. Unsay akong buhaton?", "Unsaon sa pamilya sa ikaduhang kaminyoon pagtukod og bag-ong relasyon?"]], ["🧒", "Pagpadako sa anak", ["Adik sa cellphone ang akong anak. Unsay mahimo sa ginikanan?", "Dili na mosulti kanako ang akong tin-edyer nga anak. Unsaon?", "Unsaon pagpaila sa Dios sa bata nga dili siya modumili?", "Asa ang utlanan sa disiplina ug sa pagbunal o pagsinggit?", "Unsaon pagpatubo sa pagsalig sa kaugalingon ug pagkaresponsable sa bata?", "Gi-bully ang akong anak sa eskwelahan. Unsaon pag-uban kaniya?", "Unsaon pagtubag kon mamakak ang bata?" alingon?", "Unsay buhaton kon mag-inusara?", "Unsaon pag-ila sa naandang kasubo ug sa depresyon nga nagkinahanglan og tabang?", "Bug-at kaayo ang presyur nga gusto na kong mokalagiw. Unsay mahimo?", "Unsaon paglampas sa kasakit sa pagbulag sa uyab?", "Kanunay nako mahunahunaan ang daang mga sayop. Unsaon pagbuhi niini?", "Unsaon pagtukod og himsog nga pagtamod sa kaugalingon?", "Unsaon pag-atubang sa kasina sa uban?", "Unsaon pag-atubang sa kabalaka bahin sa umaabot?"]], ["🥗", "Himsog nga kinabuhi", ["Unsa ang himsog nga pagkaon? Aduna bay yano nga lagda?", "Unsang ehersisyo ang angay sa mga edaran?", "Unsaon pagkatulog og maayo?", "Pila ka tubig ang angay imnon matag adlaw?", "Unsay epekto sa dugay nga paglingkod ug unsaon kini pag-ayo?", "Unsaon pagtukod og batasan sa regular nga ehersisyo?", "Pila ka lakang matag adlaw ang himsog?", "Unsaon pagpaniwang nga dili mobalik ang timbang?", "Kanunay ko motan-aw sa screen. Unsaon pagpanalipod sa mata?", "Unsaon pag-ayo sa nagkuko nga postura?", "Unsaon paglikay sa sip-on kon mausab ang panahon?", "Unsaon paggamit sa ideya sa Igpapahulay sa pag-ayo sa ritmo sa kinabuhi?"]], ["🏥", "Pag-atiman sa panglawas", ["Unsay kalainan sa sip-on ug trangkaso? Kanus-a angay magpatan-aw sa doktor?", "Unsaon pagbasa sa mga numero sa resulta sa check-up?", "Unsay angay bantayan sa adunay hayblad sa adlaw-adlaw?", "Kon prediabetes, unsaon pag-usab sa estilo sa kinabuhi?", "Sakit ang tuhod tungod sa pagkadaot. Unsaon kini pag-atiman?", "Unsang mga sintomas ang mahimong stroke ug kinahanglan dad-on dayon sa emergency?", "Unsay angay bantayan sa tigulang nga daghang tambal ang ginainom?", "Unsaon pagpamenos sa acid reflux?", "Unsa ang unang timailhan sa dementia?", "Unsaon paglikay sa osteoporosis?", "Unsaon pag-atiman sa masakiton nga pamilya nga dili mapul-an?", "Unsaon pakigsulti og maayo sa doktor?"]], ["💰", "Kwarta", ["Unsay gitudlo sa Bibliya bahin sa kwarta?", "Unsaon pagsugod sa pagrekord sa gasto ug pagbadyet sa pamilya?", "Unsa ang d sa simbahan", ["Unsaon nako pagkahibalo kon unsang pag-alagad ang haum kanako?", "Kapoy na ko sa pag-alagad ug gusto nang mohunong. Unsay akong buhaton?", "Unsaon pagpangulo og maayo sa tigom sa gamay nga grupo?", "Kon hilom kaayo ang gamay nga grupo, unsaon pagpabuhi sa istorya?", "Lahi-lahi ang opinyon sa mga kauban sa pag-alagad. Unsaon kini pagsulbad?", "Unsaon pag-alagad nga mapaubsanon, dili aron makit-an?", "Unsaon pag-andam og mubo nga pagpaambit o wali?", "Unsaon pagpangulo sa pagdayeg ug pagsimba?", "Unsaon pagbisita ug pag-atiman sa masakiton o huyang nga kaigsoonan?", "Unsaon pag-andam sa sunod nga mga kauban sa pag-alagad?", "Unsaon pagbalanse sa pag-alagad, pamilya ug trabaho?", "Unsa ang lima ka ministeryo, ug nganong kinahanglan sa simbahan ang team nga pag-alagad?"]], ["🤲", "Pagdala og tawo kang Cristo", ["Unsaon pagsugod sa pagpaambit sa Maayong Balita sa mga tawo sa akong palibot?", "Unsaon paggamit sa akong pagpamatuod aron maabli ang Maayong Balita?", "Miingon ang higala, \"Naa na koy kaugalingong relihiyon.\" Unsaon pagtubag?", "Nangutana ang higala, \"Tinuod ba nga naay Dios?\" Unsaon pagtubag?", "Unsaon pagdapit sa higala sa tigom?", "Kon gusto na siyang motuo, unsaon pagtultol kaniya sa pag-ampo?", "Unsaon pag-ampo alang sa pamilya nga wala pa motuo?", "Gisupak sa pamilya ang akong pagtuo. Unsaon pag-atubang?", "Unsaon pagbasa sa Bibliya uban sa bag-ong magtutuo?", "Unsaon pag-uban sa bag-ong magtutuo sa iyang unang bulan?", "Unsaon nga dili maluya kon isalikway ang Maayong Balita?", "Unsa ang 920, ug unsaon pagpaambit sa Maayong Balita sa natural nga paagi pinaagi sa relasyon?"]], ["🔥", "Pag-ila sa Balaang Espiritu", ["Kinsa ang Balaang Espiritu? Usa ba ka gahom o Dios mismo?", "Unsay gibuhat sa Balaang Espiritu sa una kong pagtuo?", "Unsay buot ipasabot nga ang Espiritu nagpuyo kanako?", "Unsaon pag-ila sa giya sa Espiritu ug sa akong kaugalingong hunahuna?", "Unsaon pagkapuno sa Balaang Espiritu?", "Unsa ang bunga sa Espiritu ug unsaon function hm(s){ var p=s.split(':'); return [+p[0],+p[1]]; }
function occurs(mt,now){
 /* 台北時間（UTC+8，無夏令時間）換成 UTC 毫秒，找下一次（或正在進行的）聚會 */
 var tp=new Date(now+8*3600000), best=null;
 for(var d=-1;d<9;d++){
  var y=tp.getUTCFullYear(),mo=tp.getUTCMonth(),da=tp.getUTCDate()+d;
  var wd=new Date(Date.UTC(y,mo,da)).getUTCDay(); if(mt.days.indexOf(wd)<0) continue;
  var a=hm(mt.start),b=hm(mt.end),st=Date.UTC(y,mo,da,a[0]-8,a[1]),en=Date.UTC(y,mo,da,b[0]-8,b[1]);
  if(en>now){ best={mt:mt,start:st,end:en,live:st<=now}; break; }
 }
 return best;
}
function nextMeeting(){ var now=Date.now(),best=null; for(var i=0;i<FEL.meetings.length;i++){ var o=occurs(FEL.meetings[i],now); if(o&&(!best||o.start<best.start)) best=o; } return best; }
function locTag(){ return {en:'en-US',zs:'zh-CN',ko:'ko-KR',ja:'ja-JP',id:'id-ID',ceb:'en-PH'}[LANG]||'zh-TW'; }
function fmtT(ms){ var d=new Date(ms); function p(n){return (n<10?'0':'')+n;} return p(d.getHours())+':'+p(d.getMinutes()); }
function fmtWd(ms){ try{ return new Date(ms).toLocaleDateString(locTag(),{weekday:'short'}); }catch(e){ return ''; } }
function sameTz(){ return new Date().getTimezoneOffset()===-480; }
function cdText(o){
 var now=Date.now();
 if(o.live) return T('liveLeft',Math.max(1,Math.round((o.end-now)/60000)));
 var m=Math.max(0,Math.round((o.start-now)/60000)),h=Math.floor(m/60);
 return h?T('cdHM',h,m%60):T('cdM',m);
}

}

 var L=S.c6L||{},h='<div class="sheethead"><h2>'+esc(C6('lgH'))+'</h2><button class="xbtn" data-act="close">'+T('close')+'</button></div>';
 if(L.stage==='outline') return h+'<p class="hint c3wait"><span class="typing"><span></span><span></span><span></span></span> '+esc(C6('lgOutlining'))+'</p>';
 if(L.stage==='edit') return h+'<p class="hint">'+esc(C6('lgEditHint'))+'</p><textarea id="c6ol" class="ctta" rows="16">'+esc(L.outline||'')+'</textarea><button class="ctgo" data-act="ctlgwrite">'+esc(C6('lgWrite'))+'</button>';
 if(L.stage==='write') return h+'<p class="hint c3wait"><span class="typing"><span></span><span></span><span></span></span> '+esc(C6('lgWriting',L.k+1))+' ('+esc(C6('progress',L.k+1,L.n))+')</p><div class="c6bar"><i style="width:'+Math.round(100*L.k/Math.max(1,L.n))+'%"></i></div><button class="ctbtn" data-act="ctlgstop">'+esc(C6('lgStop'))+'</button>';
 h+='<p class="hint">'+esc(C6('lgHint'))+'</p><div class="sec"><h3>'+esc(C6('lgP'))+'</h3><input id="c6lp" class="ctin" value="'+esc(L.p||'')+'"><h3>'+esc(C6('lgT'))+'</h3><input id="c6lt" class="ctin" value="'+esc(L.t||'')+'"><h3>'+esc(C6('lgM'))+'</h3><div class="ctchips">';
 [20,30,40].forEach(function(n){ h+='<button class="chip'+((L.m||30)===n?' on':'')+'" data-act="ctlgmin" data-i="'+n+'">'+esc(C6('lgMin',n))+'</button>'; });
 var st=c5Active(); if(st) h+='</div><p class="hint">✍️ '+esc(C5('tbUseStyle',st.name))+'</p><div>';
 return h+'</div><button class="ctgo" data-act="ctlgout">'+esc(C6('lgOutline'))+'</button></div>';
}
function c6Chars(m){ return (LANG==='zh'||LANG==='zs'||LANG==='ja')?m*270:(LANG==='ko'?m*230:m*130); }
function c6LongOutline(){
 var L=S.c6L=S.c6L||{}; L.p=(($('c6lp')||{}).value||'').trim(); L.t=(($('c6lt')||{}).value||'').trim(); L.m=L.m||30;
 if(!L.p){ toast(C5('tbNeed')); return; }
 L.stage='outline'; renderSheet();
 var unit=(LANG==='zh'||LANG==='zs'||LANG==='ja'||LANG==='ko')?'characters':'words';
 var ask='Write a sermon OUTLINE in '+c6LNM()+' for a '+L.m+'-minute sermon (about '+c6Chars(L.m)+' '+unit+' when written out). Passage: '+L.p+(L.t?'. Theme/occasion/audience: '+L.t:'')+'. Format: first line "# " + title; then 5-7 sections, each starting with "## " + section title and the target minutes in brackets, followed by 2-4 bullet points of what the section covers (scripture to quote, illustration idea, application). Include an introduction, the main points, a 321 life application, and a conclusion with a response and closing prayer. Output only the outline.';
 c6Ask(sysPrompt(),ask,1800).then(function(t){ if(!t||t.indexOf('##')<0) throw 0; L.outline=t; L.stage='edit'; }).catch(function(){ L.stage=''; toast(C6('lgFail')); }).then(function(){ if(S.sheet==='ctlong') renderSheet(); });
}
function c6LongWrite(){
 var L=S.c6L; if(!L) return; L.outline=(($('c6ol')||{}).value||L.outline||'').trim();
 var title=(L.outline.match(/^#\s+(.+)$/m)||[])[1]||L.p,secs=L.outline.split(/\n(?=##\s)/).filter(function(x){ return /^##\s/.test(x.trim()); });
 if(!secs.length){ toast(C6('lgFail')); return; }
 L.stage='write'; L.k=0; L.n=secs.length; L.out=[]; L.stop=false; renderSheet();
 var per=Math.round(c6Chars(L.m)/secs.length),unit=(LANG==='zh'||LANG==='zs'||LANG==='ja'||LANG==='ko')?'characters':'words';
 function next(){
  if(L.stop){ finish(); return; } if(L.k>=secs.length){ finish(); return; }
  var prev=L.out.length?L.out[L.out.length-1].slice(-700):'';
  var ask='You are writing a full sermon MANUSCRIPT (word for word, to be spoken aloud) in '+c6LNM()+', section by section.\nFULL OUTLINE:\n'+L.outline+'\n\nNow write ONLY this section, about '+per+' '+unit+':\n'+secs[L.k]+'\n\nStart with the section heading line exactly as given ("## …"). Speak naturally to the congregation, quote Bible verses in full with references, use a story or illustration where planned, and make smooth transitions. '+(prev?'The previous section ended with:\n"…'+prev+'"\nContinue seamlessly; do not repeat it.':'This is the first section.')+' Do not write other sections.';
  c6Ask(sysPrompt(),ask,Math.min(8000,Math.round(per*2.2)+600)).then(function(t){ if(!t) throw 0; L.out.push(t.trim()); L.k++; if(S.sheet==='ctlong') renderSheet(); next(); }).catch(function(){ toast(C6('lgFail')); L.stop=true; finish(); });
 }
 function finish(){ if(!L.out.length){ L.stage='edit'; if(S.sheet==='ctlong') renderSheet(); return; }
  var full='# '+title+'\n\n'+L.out.join('\n\n'); closeSheet(); S.c6L=null;
  c6Push('📜 '+C6('lgNav')+'：'+title+'\n'+L.p+(L.t?'｜'+L.t:'')+'｜'+C6('lgMin',L.m),full,'',modeText()+' · 📜');
  toast(C6('lgDone',full.length)); }
 next();
}
/* ---------- 讀網址 ---------- */
function c6UrlHTML(){ var h='<div class="sheethead"><h2>'+esc(C6('urlH'))+'</h2><button class="xbtn" data-act="close">'+T('close')+'</button></div><p class="hint">'+esc(C6('urlHint'))+'</p>';
 if(S.c6U) return h+'<p class="hint c3wait"><span class="typing"><span></span><span></span><span></span></span> '+esc(C6('urlReading'))+'</p>';
 return h+'<input id="c6u" class="ctin" type="url" inputmode="url" placeholder="https://…" style="margin-top:10px"><textarea id="c6uq" class="ctta" rows="3" placeholder="'+esc(C6('urlQ'))+'" style="margin-top:8px"></textarea><button class="ctgo" data-act="ctugo">'+esc(C6('urlGo'))+'</button>'; }
function c6Fetch(url){
 var same=url.indexOf(location.origin)===0;
 function direct(){ return fetch(url).then(function(r){ if(!r.ok) throw 0; return r.text(); }).then(function(t){ return /<html|<body/i.test(t)?c3Html(t):t; }); }
 if(same) return direct();
 return fetch('https://r.jina.ai/'+url,{headers:{'Accept':'text/plain'}}).then(function(r){ if(!r.ok) throw 0; return r.text(); }).catch(direct);
}
function c6UrlGo(){
 var url=(($('c6u')||{}).value||'').trim(),q=(($('c6uq')||{}).value||'').trim()||C6('urlDefQ');
 if(!/^https?:\/\/\S+\.\S+/.test(url)){ var u=$('c6u'); if(u) u.focus(); return; }
 S.c6U=true; renderSheet();
 c6Fetch(url).then(function(t){ t=String(t||'').replace(/\n{3,}/g,'\n\n').trim(); if(t.length<80) throw 0;
  var ti=(t.match(/^Title:\s*(.+)$/m)||[])[1]||'';
  S.c6U=false; closeSheet(); S.c6Ctx='[Web page content — '+url+']\n'+t.slice(0,24000); send('🔗 '+(ti?ti+'\n':'')+url+'\n\n'+q);
 }).catch(function(){ S.c6U=false; if(S.sheet==='ctlurl') renderSheet(); toast(C6('urlBad')); });
}
function c6UserMsg(u){ if(S.c6Ctx){ u.ctx=S.c6Ctx; S.c6Ctx=null; } if(S.asst) u.asst=1; return u; }

function c6BookHTML(){
 var B=S.c6B||{o:{a:1,b:1}},h='<div class="sheethead"><h2>'+esc(C6('bkH'))+'</h2><button class="xbtn" data-act="close">'+T('close')+'</button></div>';
 if(B.run) return h+'<p class="hint c3wait"><span class="typing"><span></span><span></span><span></span></span> '+esc(B.k>=B.n?C6('bkFinal'):C6('bkReading',B.k+1))+'</p><div class="c6bar"><i style="width:'+Math.round(100*B.k/Math.max(1,B.n))+'%"></i></div><p class="hint">'+esc(C6('progress',Math.min(B.k,B.n),B.n))+'</p><button class="ctbtn" data-act="ctbkstop">'+esc(C6('lgStop'))+'</button>';
 h+='<p class="hint">'+esc(C6('bkHint'))+'</p><button class="wide" data-act="ctbkfile" style="margin:10px 0"><span>'+(B.name?'📄 '+esc(B.name)+' · '+esc(C3('srcChars',B.text.length)):esc(C6('bkFile')))+'</span><span>›</span></button>';
 h+='<div class="sec"><h3>'+esc(C6('bkOut'))+'</h3><div class="ctchips">';
 [['a','bkO1'],['b','bkO2'],['c','bkO3'],['d','bkO4']].forEach(function(x){ h+='<button class="chip'+(B.o[x[0]]?' on':'')+'" data-act="ctbko" data-v="'+x[0]+'">'+esc(C6(x[1]))+'</button>'; });
 h+='</div>'+(B.text&&B.text.length>60000?'<p class="hint">⏳ '+esc(C6('bkBig',B.text.length))+'</p>':'')+'<button class="ctgo" data-act="ctbkgo"'+(B.text?'':' disabled')+'>'+esc(C6('bkGo'))+'</button></div>';
 return h;
}
function c6BookGo(){
 var B=S.c6B; if(!B||!B.text) return;
 var parts=[],t=B.text,size=7000; for(var i=0;i<t.length;i+=size){ var cut=Math.min(t.length,i+size); if(cut<t.length){ var p=t.lastIndexOf('\n',cut); if(p>i+size*0.6) cut=p; } parts.push(t.slice(i,cut)); i=cut-size; }
 parts=parts.filter(function(x){ return x.trim().length>20; }).slice(0,80);
 B.run=true; B.k=0; B.n=parts.length; B.sum=[]; B.stop=false; renderSheet();
 var sys='You are a careful reader helping a pastor study a book. Be faithful to the text; do not invent.',lnm=c6LNM();
 function one(k){ return c6Ask(sys,'This is part '+(k+1)+' of '+parts.length+' of "'+B.name+'". Summarize it in '+lnm+': a short heading for this part, then 4-8 bullet key points, key Bible verses mentioned (references), and at most one short memorable quote. Under 450 characters/250 words.\n\nTEXT:\n'+parts[k],900).then(function(s){ B.sum[k]=s; },function(){ B.sum[k]='('+(k+1)+') —'; }).then(function(){ B.k++; if(S.sheet==='ctbook') renderSheet(); }); }
 var idx=0; function worker(){ if(B.stop||idx>=parts.length) return Promise.resolve(); var k=idx++; return one(k).then(worker); }
 Promise.all([worker(),worker(),worker()]).then(function(){
  if(!B.sum.length){ B.run=false; renderSheet(); return; }
  var all=B.sum.map(function(s,k){ return '【'+(k+1)+'】\n'+(s||''); }).join('\n\n'),want=[];
  if(B.o.a) want.push('"## " key points of the whole book (8-12 bullets) and its main message');
  if(B.o.c) want.push('"## " a book report (about 800 characters/500 words: summary, insights, evaluation from a biblical perspective, application)');
  if(B.o.d) want.push('"## " small-group discussion questions (8-10, grouped by section)');
  B.k=B.n; if(S.sheet==='ctbook') renderSheet();
  var fin=want.length?c6Ask(sysPrompt(),'Below are part-by-part summaries of the book "'+B.name+'". Write in '+lnm+':\n- '+want.join('\n- ')+'\nUse headings starting with "## ". Be faithful to the summaries.\n\nSUMMARIES:\n'+all.slice(0,30000),5000):Promise.resolve('');
  return fin.then(function(f){ var body='# 📚 '+B.name+'\n\n'+(f||'')+(B.o.b?'\n\n## '+C6('bkO2')+'\n\n'+all:'');
   var ctx='[Book "'+B.name+'" — part summaries prepared by Xiaozhi]\n'+all.slice(0,20000); closeSheet(); S.c6B=null;
   c6Push('📚 '+C6('bkNav')+'：'+B.name,body,ctx,modeText()+' · 📚'); toast(C6('bkDone')); });
 }).catch(function(){ B.run=false; if(S.sheet==='ctbook') renderSheet(); toast(C6('lgFail')); });
}

function c6StartAsst(a){ closeSheet(); closeDrawer(); goView('home'); S.asst={id:a.id,name:a.name,ic:a.ic,ins:a.ins,st:a.st}; render(); }
function ct6Act(a,b,i,fid,v){
 if(a==='ctph'){ closeDrawer(); openSheet('ctph'); }
 else if(a==='ctphuse'){ var P=c6Phr(),q=$('q'); if(!q||!P[i]) return true; q.value=(q.value.trim()?q.value.replace(/\s+$/,'')+'\n':'')+P[i]; closeSheet(); autosize(); q.focus(); }
 else if(a==='ctphadd'){ var t=(($('c6pin')||{}).value||'').trim(); if(!t) return true; var P2=c6Phr(); P2.push(t.slice(0,200)); lsSet('phr',P2); renderSheet(); }
 else if(a==='ctphdel'){ var P3=c6Phr(); P3.splice(i,1); lsSet('phr',P3); renderSheet(); }

 else if(a==='ctasedit'){ var x=c6Find(fid); if(x){ S.c6E={id:x.id,ic:x.ic,name:x.name,ins:x.ins,st:x.st}; S.ctArm=false; renderSheet(); } }
 else if(a==='ctassave'){ var E=S.c6E; if(!E) return true; var nm=(($('c6an')||{}).value||'').trim(); if(!nm){ var ne=$('c6an'); if(ne) ne.focus(); return true; }
  var rec={id:E.id||'a'+Date.now().toString(36),ic:E.ic||'🤖',name:nm.slice(0,24),ins:(($('c6ai')||{}).value||'').slice(0,3000),st:(($('c6as')||{}).value||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).slice(0,6).join(';;')};

 else if(a==='ctasdel'){ if(!S.ctArm){ S.ctArm=true; renderSheet(); return true; } S.ctArm=false; var id=S.c6E&&S.c6E.id; lsSet('assts',c6Asst().filter(function(x){ return x.id!==id; })); S.c6E=null; renderSheet(); }
