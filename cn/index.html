      $('#pfX').onclick = () => m.remove();
      m.onclick = e => { if (e.target === m) m.remove(); };
      const finish = msg => { save(); m.remove(); toast(msg, 2200); refresh(); if (after && after !== refresh) { try { after(); } catch (e) {} } };
      $('#pfApplyAud').onclick = () => { grab(); commit(); X.setAud(pfSuggestAud(p)); toast(L3('回答對象：', '回答对象：', 'Answering for: ') + X.audName(X.aud()), 1800); refresh(); draw(); };

      const del = $('#pfDel'); if (del) del.onclick = () => { ST.profiles.splice(ST.pfIdx, 1); ST.pfIdx = 0; finish(L3('已刪除', '已删除', 'Deleted')); };

<script>
(function(){
var PROXY=(window.XZ_CN&&window.XZ_CN.api)||'', MODEL=(window.XZ_CN&&window.XZ_CN.model)||'';
var LS='xz321cn_';
function lsGet(k,d){try{var v=localStorage.getItem(LS+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v));return true;}catch(e){return false;}}
var IDBP=null;
function idb(){ if(!IDBP) IDBP=new Promise(function(res){ try{ var r=indexedDB.open('xz321cn',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ res(null); }; }catch(e){ res(null); } }); return IDBP; }
function idbPut(k,v){ return idb().then(function(db){ if(!db) return false; return new Promise(function(res){ try{ var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=function(){res(true);}; t.onerror=t.onabort=function(){res(false);}; }catch(e){ res(false); } }); }); }

/* ---------- markdown ---------- */
function inl(s){
 s=String(s==null?'':s).replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g,function(x,c){ return '\u0001'+c.charCodeAt(0)+'\u0002'; });
 s=esc(s);

 s=s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,'$1<em>$2</em>');
 s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
 s=s.replace(/\u0001(\d+)\u0002/g,'&#$1;');
 return s;
}
function trClean(s){ return String(s||'').replace(/^%%\s?/,'').replace(/^(#{1,6}\s+|[-*•]\s+|>\s*)+/,''); }
var RE_UL=/^[-*•・]\s+/, RE_OL=/^\d{1,2}[.、)）](?!\d)\s*/;
function cells(r){ r=r.replace(/^\|/,'').replace(/\|$/,''); return r.split('|'); }
function indentOf(l){ var m=l.match(/^[ \t]*/)[0]; return m.replace(/\t/g,'    ').length; }
function isItem(t){ return RE_UL.test(t)||RE_OL.test(t); }
function listHTML(L,i){
 /* 讀一整組清單（含縮排子清單），回傳 [html, 下一行] */
 var base=indentOf(L[i]),ordered=RE_OL.test(L[i].trim()),start=parseInt(L[i].trim(),10)||1,items=[],cur=null;
 while(i<L.length){
  var raw=L[i],t=raw.trim();
  if(t&&/^%%\s?/.test(t)&&cur){ cur.h+='<span class="tr">'+inl(trClean(t))+'</span>'; i++; continue; }
  if(!t){ var nx=i+1; while(nx<L.length&&!L[nx].trim()) nx++; if(nx<L.length&&isItem(L[nx].trim())&&indentOf(L[nx])>=base&&(indentOf(L[nx])>base||RE_OL.test(L[nx].trim())===ordered)){ i=nx; continue; } break; }
  var ind=indentOf(raw);
  if(isItem(t)&&ind<=base+1){
   if(RE_OL.test(t)!==ordered&&ind<=base) break;
   cur={h:inl(t.replace(ordered?RE_OL:RE_UL,'').replace(RE_UL,'').replace(RE_OL,'')),sub:''}; items.push(cur); i++; continue;
  }
  if(isItem(t)&&ind>base+1&&cur){ var r=listHTML(L,i); cur.sub+=r[0]; i=r[1]; continue; }
  if(ind>base&&cur&&!/^(#{1,6}\s|>|\|)/.test(t)){ cur.h+='<br>'+inl(t); i++; continue; }
  break;
 }
 var tag=ordered?'ol':'ul',h='<'+tag+(ordered&&start!==1?' start="'+start+'"':'')+'>';
 for(var k=0;k<items.length;k++) h+='<li>'+items[k].h+items[k].sub+'</li>';
 return [h+'</'+tag+'>',i];
}
function md(src){
 var L=String(src||'').replace(/\r/g,'').split('\n'),out=[],i=0,para=[];
 var TRL=/^%%\s?/;
 function flush(){ if(para.length){ var a=[]; for(var k=0;k<para.length;k++) a.push(inl(para[k])); out.push('<p>'+a.join('<br>')+'</p>'); para=[]; } }
 while(i<L.length){
  var t=L[i].trim();
  if(!t){flush();i++;continue;}
  if(TRL.test(t)){flush(); out.push('<p class="tr">'+inl(trClean(t))+'</p>'); i++; continue;}
  if(/^\|.*\|$/.test(t)&&i+1<L.length&&/^\|?\s*:?-{2,}/.test(L[i+1].trim())){
   flush(); var rows=[]; while(i<L.length&&/^\|.*\|$/.test(L[i].trim())){rows.push(L[i].trim());i++;}
   var h='<div class="tbl"><table>';
   for(var r=0;r<rows.length;r++){ if(r===1) continue; var cs=cells(rows[r]),tag=r===0?'th':'td'; h+='<tr>'; for(var c=0;c<cs.length;c++) h+='<'+tag+'>'+inl(cs[c].trim())+'</'+tag+'>'; h+='</tr>'; }
   out.push(h+'</table></div>'); continue;
  }
  var hm=t.match(/^(#{1,6})\s+(.*)$/);
  if(hm){flush(); var lv=Math.min(4,hm[1].length+1); out.push('<h'+lv+'>'+inl(hm[2].replace(/\*\*/g,''))+'</h'+lv+'>'); i++; continue;}
  var bh=t.match(/^\*\*([^*]{1,40})\*\*[：:]?$/);
  if(bh&&!para.length){flush(); out.push('<h4>'+esc(bh[1])+'</h4>'); i++; continue;}
  if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){flush();i++;continue;}
  if(/^>/.test(t)){flush(); var q=[]; while(i<L.length&&(/^>/.test(L[i].trim())||(q.length&&TRL.test(L[i].trim())))){ var ql=L[i].trim().replace(/^>\s?/,''); q.push(TRL.test(ql)?'<span class="tr">'+inl(trClean(ql))+'</span>':'<span class="ql">'+inl(ql)+'</span>'); i++;} out.push('<blockquote>'+q.join('')+'</blockquote>'); continue;}
  if(isItem(t)){flush(); var res=listHTML(L,i); out.push(res[0]); i=res[1]; continue;}
  para.push(t); i++;
 }
 flush(); return out.join('');
}
function plain(s){
 return String(s||'').replace(/\r/g,'').split('\n').map(function(l){
  var t=l.trim();
  if(/^\|?\s*:?-{2,}/.test(t)&&t.indexOf('|')>=0) return '';
  if(/^\|.*\|$/.test(t)) return '・'+cells(t).map(function(x){return x.trim();}).join('　');
  return t.replace(/^(>\s*)?%%\s?/,'').replace(/^#{1,6}\s+/,'').replace(/^>\s?/,'').replace(/^(-{3,}|\*{3,})$/,'').replace(RE_UL,'・');
 }).join('\n').replace(/\\([\\`*_{}\[\]()#+\-.!>~|])/g,'$1').replace(/\*\*|`/g,'').replace(/\n{3,}/g,'\n\n').trim();
}

function viaSample(sample,msgs,onPart,signal){

function postOnce(body,signal){
 if(!PROXY){ var e0=new Error('noapi'); e0.cn=true; return Promise.reject(e0); }
 return fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:signal}).then(function(res){
  if(!res.ok){ var e=new Error('http '+res.status); e.http=res.status; throw e; }
  return res.json();

}
function postRetry(body,signal){

function viaProxy(msgs,onPart,signal){

  return postRetry({model:MODEL,max_tokens:maxTok(),system:sysPrompt(),messages:m},signal).then(function(d){
   var t=extractReply(d),sr=d&&(d.stop_reason||(d.choices&&d.choices[0]&&d.choices[0].finish_reason));

   return acc;
  });
 }

}

var TOOLS=[["🙏", "祷告范例", "不知道怎么开口？照着说就可以", "### 决志祷告（想接受耶稣时）\n亲爱的天父，我承认我是一个罪人，常常以自己为中心，离开了你。谢谢你差耶稣为我死在十字架上，担当我的罪，又从死里复活。我现在愿意打开心门，接受耶稣作我的救主，也请你在我的生命中作王。求圣灵住在我心里，引导我一生跟随你。奉耶稣基督的名祷告，阿们。\n\n### 早晨交托\n主啊，谢谢你赐给我新的一天。我把今天所有的计划、工作和遇见的人都交在你手里。求你让我焦点在你，不在自己、别人和环境；求圣灵引导我的心思言语，让人在我身上看见耶稣。奉耶稣的名，阿们。\n\n### 饭前感恩\n天父，谢谢你赐给我们今天的饮食，也谢谢预备这顿饭的人。求你祝福这些食物，使我们身体健壮，好来荣耀你。奉耶稣的名，阿们。\n\n### 为家人祷告\n主啊，我把我的家人（说出名字）交托给你。求你保守他们的身体平安、心里有平安；求你打开他们的心，认识你的爱。也求你先改变我，让我用谦卑和爱心对待他们。奉耶稣的名，阿们。\n\n### 认罪悔改\n主啊，我向你承认（说出具体的事）。我错了，求你赦免我，用耶稣的宝血洗净我。求你给我力量离开这罪，也给我勇气向被我伤害的人道歉。谢谢你的饶恕和恩典。奉耶稣的名，阿们。\n\n### 忧虑与病痛中\n主啊，你知道我现在的难处（说出来）。我心里害怕、软弱，但我相信你在掌权。我把这一切卸给你，求你医治、安慰，赐我出人意外的平安。即使我还不明白，我仍然信靠你。奉耶稣的名，阿们。\n\n### 睡前感恩\n主啊，谢谢你今天的保守。我回想今天三件值得感恩的事（说出来）。今天做得不好的地方，求你赦免；明天的事，我交给你。求你赐我安睡。奉耶稣的名，阿们。\n\n> 祷告不在于用词漂亮，而在于真诚。神是我们的父，可以像孩子对爸爸说话一样告诉他。", ["怎样建立每天祷告的习惯？", "祷告的时候总是分心，怎么办？"]], ["🕊️", "一分钟讲福音", "四个要点，向亲友简单说明", "福音就是“好消息”。可以用四个要点、四节经文来说：\n\n### 1. 神爱你\n神创造了你，也深深爱你，要你得着丰盛的生命。\n> 神爱世人，甚至将他的独生子赐给他们，叫一切信他的，不至灭亡，反得永生。（约翰福音 3:16）\n\n### 2. 人离开了神\n人以自己为中心，想自己作主，这就是罪的根源。罪使人与神隔绝，生命失去方向和平安。\n> 因为世人都犯了罪，亏缺了神的荣耀。（罗马书 3:23）\n\n### 3. 耶稣是唯一的桥梁\n耶稣为我们死在十字架上，担当了我们的罪，第三天从死里复活，打开了回到神面前的路。\n> 耶稣说：我就是道路、真理、生命；若不借着我，没有人能到父那里去。（约翰福音 14:6）\n\n### 4. 你可以回应\n只要承认自己的需要，相信耶稣，接受他作你的救主，让他在你生命中作王，你就得着新生命。\n> 凡接待他的，就是信他名的人，他就赐他们权柄，作神的儿女。（约翰福音 1:12）\n\n**分享小提醒**：先关心人，再分享福音；说自己的真实经历，比讲道理更能打动人。对方愿意时，可以用“祷告范例”里的决志祷告一起祷告。", ["朋友对福音有疑问，我可以怎么回应？", "怎样用我自己的见证分享福音？"]], ["🌿", "初信第一周", "刚信主的七个小步骤", "刚信主就像刚出生的婴孩，需要每天吃、每天长。第一周可以这样走：\n\n1. **第一天：确认得救** —— 读约翰一书 5:11-13，知道信耶稣的人已经有永生，不是靠感觉，而是靠神的应许。\n2. **第二天：开始读经** —— 从马可福音第 1 章开始，每天读一章，问自己：耶稣是怎样的一位？\n3. **第三天：学习祷告** —— 每天早晚各花五分钟，用自己的话感谢、交托、认罪、祈求。\n4. **第四天：认识圣灵** —— 读约翰福音 14:16-17，圣灵已经住在你里面，帮助你、引导你。\n5. **第五天：找一位属灵同伴** —— 找一位信主较久的弟兄姊妹，每周一起聊聊、一起祷告。\n6. **第六天：与人分享** —— 把你信主的事告诉一位你信任的家人或朋友。\n7. **第七天：一起敬拜** —— 和其他信徒一起敬拜、读经、祷告，在团契中成长。\n\n> 若有人在基督里，他就是新造的人，旧事已过，都变成新的了。（哥林多后书 5:17）", ["刚信主，怎样开始每天灵修？", "什么是得救的确据？"]], ["📖", "每天15分钟灵修", "读、想、祷、行四步", "每天找一个安静的时间，用 15 分钟和神相处：\n\n### 1. 读（5 分钟）\n慢慢读一段经文（一章或几节都可以）。初信者可从马可福音、约翰福音、诗篇开始。\n 祝福时不要顺便说教；就算刚管教过，也要用祝福结束一天，让孩子知道爱没有改变。", ["怎样为孩子祷告？", "怎样跟青春期的孩子建立关系？"]], ["📅", "90天读经入门", "每天一章，读完核心经卷", "每天读一章，大约 10 分钟，90 天认识圣经的核心：\n\n| 天数 | 经卷 | 重点 |\n|---|---|---|\n| 1–16 | 马可福音 | 认识耶稣是谁、做了什么 |\n| 17–37 | 约翰福音 | 耶稣是神的儿子，信他得永生 |\n| 38–45 | 创世记 1–8 章 | 创造、堕落与神的救赎计划 |\n| 46–61 | 罗马书 | 因信称义，福音的核心 |\n| 62–67 | 以弗所书 | 在基督里的身份、教会与家庭 |\n| 68–71 | 腓立比书 | 在一切环境中靠主喜乐 |\n| 72–76 | 雅各书 | 信心要活出来 |\n| 77–81 | 约翰一书 | 得救的确据与彼此相爱 |\n| 82–90 | 诗篇 1、23、27、32、46、51、91、103、139 篇 | 学习用诗篇祷告 |\n\n**读法**：每天用“每天15分钟灵修”的读、想、祷、行四步。漏读了不要补得太辛苦，接着读今天的就好。", ["马可福音的主题是什么？", "怎样一年读完整本圣经？"]], ["👑", "认识321理念", "三个基础、两个核心、一个目的", "### 三个基础\n- **耶稣是我的榜样** —— 学习耶稣的生命和样式。\n- **圣经是我的准则** —— 用神的话衡量一切。\n- **圣灵是我的引导** —— 用心倚靠圣灵，不用脑倚靠自己。\n\n### 两个核心\n- **让耶稣作王** —— 不是我自己活，乃是基督在我里面活。\n- **让耶稣得着一切的荣耀** —— 一切都是神的恩典，凡事谢恩。\n\n### 一个目的\n- **建立属神的体系** —— 在家庭、工作和群体中活出神国的样式。\n\n### 改变的路径\n改变观念 → 改变生命 → 改变生活 → 改变关系 → 改变事工。\n先生命，再关系，后事工；谦卑是复兴的钥匙。\n\n> 我已经与基督同钉十字架，现在活着的不再是我，乃是基督在我里面活着。（加拉太书 2:20）", ["什么是321理念？请简单介绍。", "“无己”是什么意思？和自卑有什么不同？"]]];
