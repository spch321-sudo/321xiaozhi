<style>
/* 版面：像 ChatGPT／Claude 的單欄對話。頂列只有選單、模式、新對話；左側抽屜放導覽與最近對話；底部一個圓角輸入框。 */
:root{
  --page:#FFFFFF; --side:#F7F7F8; --soft:#F1F2F4; --line:#E5E6EA; --ink:#1D1F24; --muted:#6B6E78; --faint:#9A9DA6;
  --accent:#1E3F8F; --on-accent:#FFFFFF; --gold:#B8862E; --gold-soft:#F7EFDD; --danger:#C2453D; --shadow:0 6px 24px rgba(20,24,40,.08);
  --f-display:"Noto Serif TC","Songti TC",Georgia,serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:17px;
  --xz2-ink:var(--ink); --xz2-card:var(--page); --xz2-line:var(--line); --xz2-acc:var(--accent); --xz2-soft:var(--soft); --xz2-mut:var(--muted); --xz2-fs:var(--fs);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#212121; --side:#171717; --soft:#303030; --line:#3A3A3D; --ink:#ECECEC; --muted:#A3A3AB; --faint:#7B7B84;
  --accent:#6F8FE8; --on-accent:#0F1420; --gold:#E1B866; --gold-soft:#3A3122; --danger:#E5867F; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#212121; --side:#171717; --soft:#303030; --line:#3A3A3D; --ink:#ECECEC; --muted:#A3A3AB; --faint:#7B7B84;
  --accent:#6F8FE8; --on-accent:#0F1420; --gold:#E1B866; --gold-soft:#3A3122; --danger:#E5867F; --shadow:0 6px 24px rgba(0,0,0,.4); color-scheme:dark}
html[lang="zh-Hans"]{--f-display:"Noto Serif SC","Songti SC",Georgia,serif;--f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
html[lang="ko"]{--f-display:"Noto Serif KR","AppleMyungjo",Georgia,serif;--f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
html[lang="ja"]{--f-display:"Noto Serif JP","Hiragino Mincho ProN",Georgia,serif;--f-body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
html[lang="ko"] body{word-break:keep-all;overflow-wrap:anywhere}
html[lang="id"],html[lang="ceb"]{--f-display:Georgia,"Times New Roman",serif;--f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
html[lang="en"]{--f-display:Georgia,"Times New Roman",serif;--f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
html.fs0{--fs:15.5px} html.fs1{--fs:17px} html.fs2{--fs:19.5px} html.fs3{--fs:22.5px}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.7;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:22px;height:22px;display:block}
#app{display:flex;flex-direction:column;height:100%}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 頂列 */
.top{flex:none;background:var(--page)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--page);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink)}
.round:hover{background:var(--soft)}
.tl{display:flex;gap:6px;flex:none}
.round.sm{width:40px;height:40px}
.round.sm svg{width:20px;height:20px}
.navrow{display:flex;gap:8px;justify-content:center;padding:4px 0 2px}
.navrow.top1{justify-content:flex-start}
.navb{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--page);border-radius:999px;padding:7px 16px 7px 12px;font-size:.88em;color:var(--ink)}
.navb svg{width:18px;height:18px}
.navb:hover{background:var(--soft)}
@media (max-width:400px){.modepill{padding:8px 10px;font-size:.78em}.tl{gap:4px}}
.modepill{min-width:0;display:flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-size:.84em;font-weight:600}
.modepill #modeTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.modepill svg{width:16px;height:16px;flex:none;color:var(--muted)}

/* 對話 */
#scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#flow{padding-block:12px 28px;display:flex;flex-direction:column;gap:22px;min-height:100%}
#flow > *{min-width:0;max-width:100%}
body.empty #flow{justify-content:flex-end;gap:14px}
.hello{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:20px 8px}
.hlamp{width:72px;height:72px;border-radius:20px;overflow:hidden;margin-bottom:6px;box-shadow:0 4px 16px rgba(30,63,143,.18)}
.hlamp img,.dlamp img{width:100%;height:100%;object-fit:cover;display:block}
.hello h1{font-family:var(--f-display);font-weight:500;font-size:1.65em;line-height:1.3;margin:0;text-wrap:balance}
.hello p{margin:0;color:var(--muted);font-size:.9em;max-width:30em}
.sugg{display:flex;flex-direction:column}
.srow{display:flex;align-items:flex-start;gap:14px;border:0;background:transparent;text-align:left;padding:11px 4px;border-radius:12px;color:var(--ink);line-height:1.5}
.srow:hover{background:var(--soft)}
.srow i{font-style:normal;flex:none;width:24px;text-align:center}
.srow span{color:var(--ink);opacity:.85;overflow-wrap:anywhere;min-width:0}
.srow2{display:flex;justify-content:space-between;gap:10px;padding:6px 4px 0}
.slink{border:0;background:transparent;color:var(--muted);font-size:.84em;padding:4px 0}
.slink:hover{color:var(--ink)}

.msg{display:flex;flex-direction:column;gap:6px;min-width:0}
.msg.user{align-items:flex-end}
.msg.user .bub{background:var(--soft);border-radius:22px;padding:10px 16px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .body{min-width:0;overflow-wrap:anywhere}
.msg.ai.err .body{color:var(--danger)}
.msg.ai.crisis{background:var(--gold-soft);border-radius:16px;padding:14px 16px}
.body{line-height:1.8;letter-spacing:.01em}
.body > :first-child{margin-top:0}.body > :last-child{margin-bottom:0}
.body p{margin:.7em 0}
.body h2,.body h3,.body h4{line-height:1.4;font-weight:700;color:var(--ink);margin:1.5em 0 .5em}
.body h2{font-size:1.28em}
.body h3{font-size:1.14em}
.body h4{font-size:1.02em}
.body h2+p,.body h3+p,.body h4+p,.body h3+ul,.body h3+ol,.body h4+ul,.body h4+ol{margin-top:.3em}
.body ul,.body ol{margin:.6em 0;padding-left:1.5em}
.body li{margin:.35em 0;padding-left:.2em}
.body li::marker{color:var(--accent);font-weight:700}
.body ul ul,.body ol ul,.body ul ol{margin:.3em 0}
.body ul ul li::marker{color:var(--faint)}
.body strong{font-weight:700;color:var(--ink)}
.body em{font-style:normal;color:var(--accent)}
.body blockquote{margin:1em 0;padding:11px 16px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 12px 12px 0;font-weight:500;line-height:1.75}
.body hr{border:0;height:0;margin:.8em 0}
.body code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.88em}
.tbl{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:12px}
.body table{border-collapse:collapse;font-size:.92em;min-width:100%}
.body th,.body td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.body th + th,.body td + td{border-left:1px solid var(--line)}
.body tr:last-child td{border-bottom:0}
.body th{background:var(--soft);font-weight:700;white-space:nowrap}
.fold .body{max-height:12em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{align-self:flex-start;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.78em}
.acts{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-left:-8px}
.ib{width:36px;height:36px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ib svg{width:19px;height:19px}
.ib:hover{background:var(--soft);color:var(--ink)}
.ib.faved{color:var(--gold)}
.act{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.84em;color:var(--ink)}
.act svg{width:16px;height:16px}
.meta{font-size:.7em;color:var(--faint);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.fu{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:4px}
.fu button{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 2px;font-size:.92em;color:var(--ink)}
.fu button::after{content:"＋";margin-left:auto;color:var(--faint);font-size:.9em}
.fu button:hover{background:var(--soft)}
.fuwait{display:flex;align-items:center;gap:8px;font-size:.84em;color:var(--muted);padding:10px 2px}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:dot 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3}40%{opacity:1}}
.contnote{font-size:.8em;color:var(--muted)}

/* 輸入框：像 Claude 一樣貼在最底下的一列膠囊 */
.composer{flex:none;background:var(--page)}
.composer .wrap{padding-block:6px 8px}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:26px;padding:4px}
#q{flex:1 1 0;width:0;min-width:0;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;line-height:1.45;max-height:8.5em;padding:9px 6px;min-height:42px}
#q:focus{outline:none}
#q::placeholder{color:var(--faint)}
.cb{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--page);display:grid;place-items:center;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cb svg{width:20px;height:20px}
.lenbtn{flex:none;display:flex;align-items:center;gap:3px;height:42px;border:0;background:transparent;border-radius:999px;padding:0 8px;font-size:.78em;color:var(--muted)}
.lenbtn svg{width:18px;height:18px;color:var(--accent)}
#send{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
#send svg{width:20px;height:20px}
#send.stop{background:var(--ink);color:var(--page)}
.micbtn{flex:none;width:40px;height:42px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.micbtn svg{width:22px;height:22px}
.micbtn.on{background:var(--danger);color:#fff;width:42px;animation:micp 1.4s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(194,69,61,.45)}50%{box-shadow:0 0 0 8px rgba(194,69,61,0)}}
.micwave{display:flex;gap:3px;align-items:center;height:18px}
.micwave i{display:block;width:3px;height:8px;border-radius:2px;background:currentColor;animation:mw .9s ease-in-out infinite}
.micwave i:nth-child(2){animation-delay:.15s}.micwave i:nth-child(3){animation-delay:.3s}
@keyframes mw{0%,100%{height:5px}50%{height:17px}}
.hnote{margin-top:6px;font-size:.72em;color:var(--faint);max-width:30em}

/* 側欄抽屜 */
#drawer{position:fixed;inset:0;z-index:60;pointer-events:none}
.dmask{position:absolute;inset:0;background:rgba(0,0,0,.28);opacity:0;transition:opacity .2s}
.dpanel{position:absolute;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--side);transform:translateX(-102%);transition:transform .22s ease;overflow:hidden;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0 max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.dscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 -14px 0 -6px;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px)) 6px}
.dfab{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:.95em;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.dfab svg{width:18px;height:18px}
.cgrp{font-size:.74em;color:var(--muted);padding:14px 8px 4px;font-weight:600}
.appmini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.appmini a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--ink);padding:8px 2px;border-radius:12px;min-width:0}
.appmini a:hover{background:var(--soft)}
.appmini img{width:42px;height:42px;border-radius:11px;object-fit:cover;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.appmini span{font-size:.7em;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#drawer.open{pointer-events:auto}
#drawer.open .dmask{opacity:1}
#drawer.open .dpanel{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:4px 4px 10px}
.dlamp{width:38px;height:38px;border-radius:11px;overflow:hidden;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.dhead b{font-family:var(--f-display);font-size:1.3em;font-weight:600;flex:1}
.dhead{flex-wrap:wrap}
.dlang{flex:1 0 100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--soft);border-radius:12px;padding:3px;margin-top:8px}
.dlang button{border:0;background:transparent;border-radius:9px;padding:5px 0;font-size:.72em;color:var(--muted)}
.dlang button.on{background:var(--page);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dsearch{display:flex;align-items:center;gap:8px;background:var(--page);border-radius:12px;padding:0 12px;margin:2px 0 8px;color:var(--faint)}
.dsearch svg{width:17px;height:17px}
.dsearch input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.92em;padding:9px 0}
.dsearch input:focus{outline:none}
.dnav{display:flex;flex-direction:column}
.ditem{display:flex;align-items:center;gap:14px;border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:12px;font-size:1em;color:var(--ink)}
.ditem:hover{background:var(--soft)}
.ditem .di svg{width:21px;height:21px}
.dsec{font-size:.78em;color:var(--muted);padding:16px 8px 6px}
.applinks{display:flex;flex-direction:column;gap:2px}
.applink{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);padding:8px;border-radius:12px;min-width:0}
.applink:hover{background:var(--soft)}
.applink .ai{flex:none;width:40px;height:40px;border-radius:11px;overflow:hidden;background:var(--soft);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.applink .ai img{width:100%;height:100%;object-fit:cover;display:block}
.applink .at{flex:1 1 auto;min-width:0;line-height:1.35}
.applink .at b{display:block;font-size:.92em;font-weight:600}
.applink .at small{display:block;font-size:.72em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.applink .ago{flex:none;color:var(--faint)}
.clist{display:flex;flex-direction:column}
.cvrow{display:flex;align-items:center;border-radius:12px}
.cvrow:hover,.cvrow.on{background:var(--soft)}
.cbtn{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:9px 8px;font-size:.95em;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdel{flex:none;border:0;background:transparent;color:var(--faint);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:.78em}
.cdel svg{width:15px;height:15px}
.cdel.arm{width:auto;padding:0 10px;color:#fff;background:var(--danger)}
.ctag{display:inline-block;font-size:.72em;line-height:1.5;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px;color:var(--muted);vertical-align:1px}
.dempty{color:var(--faint);font-size:.86em;padding:6px 8px;margin:0}

/* 底部面板 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:70;display:flex;align-items:flex-end}
.sheet{background:var(--page);width:100%;max-width:760px;margin:0 auto;max-height:88vh;max-height:88dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheethead h2{margin:0;font-size:1.12em;font-weight:700}
.xbtn{border:0;background:var(--soft);border-radius:999px;padding:5px 14px;font-size:.84em}
.sec{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.sec:last-child{border-bottom:0}
.sec h3{margin:0;font-size:.8em;color:var(--muted);font-weight:600;letter-spacing:.04em}
.hint{font-size:.8em;color:var(--muted);margin:0}
.chip{flex:none;border:1px solid var(--line);background:var(--page);border-radius:999px;padding:6px 13px;font-size:.86em;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.bgrow,.audrow{display:flex;flex-wrap:wrap;gap:6px}
.audgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.audcard{display:flex;gap:9px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--page);border-radius:14px;padding:9px 11px;line-height:1.4;min-width:0}
.audcard .ic{font-size:1.3em;line-height:1.1;flex:none}
.audcard b{display:block;font-size:.92em}
.audcard small{display:block;font-size:.72em;color:var(--muted);overflow-wrap:anywhere}

 the cross? What does that have to do with me?","I've done wrong in my past. Will God still accept me?","My child is rebellious. How can I use this passage to walk with them?","Facing job loss or a failed business, how do people who trust Jesus keep going?","My parents are old and sick and I'm stretched thin. How does this passage comfort me?","I'm anxious and can't sleep. What is the peace Jesus talks about?","How can I share Jesus with unbelieving family or coworkers without putting them off?","I want to follow Jesus but fear being laughed at or opposed by family. What do I do?","How is trusting Jesus different from worshipping other gods or just being a good person?","How does a person begin to know Jesus? What small step can I take today?","I lose my temper and can't break bad habits. Can Jesus really change a person?","Death frightens me. What does Jesus mean by eternal life?","If I want to give my life to Jesus today, how do I pray?"]},"teen":{"zh":["這段經文跟我的學校生活有什麼關係？","考試壓力好大，成績不好的我還有價值嗎？","同學都有自己的圈子，我覺得被孤立，耶穌怎麼看我？","被霸凌或被朋友背叛，我很生氣，耶穌會怎麼做？","我覺得自己不夠好、不夠漂亮或帥，神真的愛我嗎？","爸媽一直吵架或管我很多，我很煩，聖經怎麼說？","朋友說基督教很迷信、科學才是對的，我怎麼回答？","我喜歡上一個人，談戀愛可以嗎？聖經有什麼智慧？","我滑手機、打遊戲停不下來，怎麼辦？","為什麼要信耶穌？不信會怎麼樣？","耶穌是真的存在過的人嗎？有什麼證據？","我做了錯事不敢讓人知道，神會原諒我嗎？","我常常焦慮、心情低落，耶穌能陪我嗎？","大家都說「做自己就好」，信耶穌是不是就沒有自由了？","神如果愛我，為什麼讓我經歷這些難過的事？","我想交到真朋友，耶穌怎麼教我交朋友？","如果我想信耶穌，要先做什麼？需要很完美嗎？","禱告真的有用嗎？可以用我自己的話跟神說嗎？","我不知道以後要念什麼、做什麼，怎麼面對未來？","我可以怎麼用自己的話，跟朋友說耶穌是誰？"],"zs":["这段经文跟我的学校生活有什么关系？","考试压力好大，成绩不好的我还有价值吗？","同学都有自己的圈子，我觉得被孤立，耶稣怎么看我？","被霸凌或被朋友背叛，我很生气，耶稣会怎么做？","我觉得自己不够好、不够漂亮或帅，神真的爱我吗？","爸妈一直吵架或管我很多，我很烦，圣经怎么说？","朋友说基督教很迷信、科学才是对的，我怎么回答？","我喜欢上一个人，谈恋爱可以吗？圣经有什么智慧？","我滑手机、打游戏停不下来，怎么办？","为什么要信耶稣？不信会怎么样？","耶稣是真的存在过的人吗？有什么证据？","我做了错事不敢让人知道，神会原谅我吗？","我常常焦虑、心情低落，耶稣能陪我吗？","大家都说“做自己就好”，信耶稣是不是就没有自由了？","神如果爱我，为什么让我经历这些难过的事？","我想交到真朋友，耶稣怎么教我交朋友？","如果我想信耶稣，要先做什么？需要很完美吗？","祷告真的有用吗？可以用我自己的话跟神说吗？","我不知道以后要念什么、做什么，怎么面对未来？","我可以怎么用自己的话，跟朋友说耶稣是谁？"],"en":["How does this passage connect to my school life?","Exam pressure is huge — am I still worth something if my grades are bad?","Everyone has their own group and I feel left out. How does Jesus see me?","I'm being bullied or betrayed by a friend and I'm angry. What would Jesus do?","I feel I'm not good-looking or good enough. Does God really love me?","My parents keep fighting or control too much and I'm fed up. What does the Bible say?","My friends say Christianity is superstition and science is right. How do I answer?","I like someone — is dating okay? What wisdom does the Bible give?","I can't stop scrolling or gaming. What can I do?","Why believe in Jesus at all? What if I don't?","Was Jesus a real person? What's the evidence?","I did something wrong and I'm afraid to tell anyone. Will God forgive me?","I'm often anxious and down. Can Jesus be with me?","Everyone says 'just be yourself' — does following Jesus mean losing my freedom?","If God loves me, why does he let sad things happen to me?","I want real friends. How does Jesus teach me to be a friend?","If I want to follow Jesus, what do I do first? Do I have to be perfect?","Does prayer really work? Can I talk to God in my own words?","I don't know what to study or do later. How do I face the future?","How can I explain in my own words who Jesus is to my friends?"]},"kid":{"zh":["這個故事在說什麼？請講給我聽。","耶穌是誰？他住在哪裡？","耶穌真的愛我嗎？我怎麼知道？","神在哪裡？我看不到他，他怎麼聽得到我說話？","我做錯事，爸媽生氣了，耶穌會不會也生氣？","我跟好朋友吵架了，耶穌會怎麼做？","我晚上怕黑、怕做噩夢，耶穌可以保護我嗎？","功課好難，我不想上學，耶穌可以幫我嗎？","為什麼耶穌要死在十字架上？","耶穌死了以後，為什麼又活過來？","我的奶奶（或小狗）生病了，耶穌會醫好她嗎？","天堂是什麼樣子？","有同學欺負我，我可以怎麼辦？耶穌怎麼說？","可以教我怎麼禱告嗎？禱告可以說什麼？","神是誰創造的？","耶穌可以做我最好的朋友嗎？怎麼做？","我怎麼可以學會跟小朋友快樂分享？","什麼是「罪」？我也有罪嗎？","請教我一句可以背起來的短經文。","我想請耶穌住在我心裡，要怎麼說？"],"zs":["这个故事在说什么？请讲给我听。","耶稣是谁？他住在哪里？","耶稣真的爱我吗？我怎么知道？","神在哪里？我看不到他，他怎么听得到我说话？","我做错事，爸妈生气了，耶稣会不会也生气？","我跟好朋友吵架了，耶稣会怎么做？","我晚上怕黑、怕做噩梦，耶稣可以保护我吗？","功课好难，我不想上学，耶稣可以帮我吗？","为什么耶稣要死在十字架上？","耶稣死了以后，为什么又活过来？","我的奶奶（或小狗）生病了，耶稣会医好她吗？","天堂是什么样子？","有同学欺负我，我可以怎么办？耶稣怎么说？","可以教我怎么祷告吗？祷告可以说什么？","神是谁创造的？","耶稣可以做我最好的朋友吗？怎么做？","我怎么可以学会跟小朋友快乐分享？","什么是“罪”？我也有罪吗？","请教我一句可以背起来的短经文。","我想请耶稣住在我心里，要怎么说？"],"en":["What is this story about? Please tell it to me.","Who is Jesus? Where does he live?","Does Jesus really love me? How do I know?","Where is God? I can't see him — how can he hear me?","I did something wrong and Mom and Dad got mad. Is Jesus mad at me too?","I had a fight with my best friend. What would Jesus do?","I'm scared of the dark and bad dreams. Can Jesus keep me safe?","Homework is so hard and I don't want to go to school. Can Jesus help me?","Why did Jesus die on the cross?","Why did Jesus come back to life after he died?","My grandma (or my puppy) is sick. Will Jesus make her better?","What is heaven like?","Someone at school is mean to me. What can I do? What does Jesus say?","Can you teach me how to pray? What can I say?","Who made God?","Can Jesus be my very best friend? How?","How can I learn to share happily with other kids?","What is 'sin'? Do I have sin too?","Teach me one short verse I can remember.","I want Jesus to live in my heart. What do I say?"]},"seeker":{"zh":["我沒讀過聖經，這段話跟我現在的生活有什麼關係？","神真的存在嗎？有什麼理由可以相信？","為什麼世界上有這麼多苦難？神為什麼不阻止？","聖經不是人寫的嗎？為什麼我可以相信它？","耶穌真的存在過嗎？他為什麼是特別的？","我覺得自己是個好人，為什麼還需要耶穌？","各種宗教不都是勸人為善嗎？基督信仰的差別在哪裡？","我壓力很大、心裡很空，聖經能給我什麼實際的幫助？","我過去做過很糟的事，這樣的人神也會接納嗎？","我家人拜拜（或有別的信仰），我信耶穌會不會不孝或被排斥？","科學和信仰是不是互相矛盾？","聽說信耶穌就要放棄很多快樂，是真的嗎？","耶穌為什麼要死？他的死跟我有什麼關係？","耶穌復活是真的嗎？有什麼根據？","我在教會遇過偽善的人，讓我很猶豫，該怎麼看？","「信主」是什麼意思？需要先懂很多道理或先改好才能信嗎？","我沒有信仰也過得不錯，信耶穌會多得到什麼？","我想先自己認識耶穌，可以怎麼開始讀聖經？","如果我決定相信耶穌，第一步怎麼做？怎麼禱告？","我還有很多疑問，可以一邊問一邊慢慢決定嗎？"],"zs":["我没读过圣经，这段话跟我现在的生活有什么关系？","神真的存在吗？有什么理由可以相信？","为什么世界上有这么多苦难？神为什么不阻止？","圣经不是人写的吗？为什么我可以相信它？","耶稣真的存在过吗？他为什么是特别的？","我觉得自己是个好人，为什么还需要耶稣？","各种宗教不都是劝人为善吗？基督信仰的差别在哪里？","我压力很大、心里很空，圣经能给我什么实际的帮助？","我过去做过很糟的事，这样的人神也会接纳吗？","我家人拜拜（或有别的信仰），我信耶稣会不会不孝或被排斥？","科学和信仰是不是互相矛盾？","听说信耶稣就要放弃很多快乐，是真的吗？","耶稣为什么要死？他的死跟我有什么关系？","耶稣复活是真的吗？有什么根据？","我在教会遇过伪善的人，让我很犹豫，该怎么看？","“信主”是什么意思？需要先懂很多道理或先改好才能信吗？","我没有信仰也过得不错，信耶稣会多得到什么？","我想先自己认识耶稣，可以怎么开始读圣经？","如果我决定相信耶稣，第一步怎么做？怎么祷告？","我还有很多疑问，可以一边问一边慢慢决定吗？"],"en":["I've never read the Bible. How does this passage connect to my life right now?","Does God really exist? What reasons are there to believe?","Why is there so much suffering in the world? Why doesn't God stop it?","Wasn't the Bible written by people? Why can I trust it?","Did Jesus really exist? What makes him special?","I think I'm a good person. Why would I still need Jesus?","Don't all religions just teach people to do good? What's different about Christianity?","I'm under a lot of stress and feel empty. What practical help can the Bible give me?","I've done some terrible things. Would God accept someone like me?","My family worships ancestors (or follows another faith). Would trusting Jesus be disrespectful or get me rejected?","Do science and faith contradict each other?","I heard following Jesus means giving up a lot of joy. Is that true?","Why did Jesus have to die? What does his death have to do with me?","Is the resurrection real? What is it based on?","I've met hypocrites in church and it makes me hesitate. How should I see that?","What does 'believing in Jesus' mean? Do I need to understand everything or get my life fixed first?","I'm doing fine without faith. What would I gain by trusting Jesus?","I'd like to get to know Jesus for myself. How can I start reading the Bible?","If I decide to trust Jesus, what's the first step? How do I pray?","I still have many questions. Can I ask them as I go and decide slowly?"]},"elder":{"zh":["年紀大了身體常常痛，這段經文怎麼安慰我？","孩子都很忙，我常常覺得孤單，耶穌怎麼陪伴我？","我怕死，也怕走了以後去哪裡，耶穌怎麼說？","老伴走了，我心裡空空的，聖經有什麼安慰？","我一輩子拜拜、拜祖先，現在信耶穌來得及嗎？","兒孫不信耶穌，我可以為他們做什麼？","我年輕時做過一些後悔的事，神還會原諒我嗎？","我眼睛花了、不太識字，怎麼聽聖經、怎麼禱告？","走到這個年紀，人生的意義是什麼？神還要我做什麼？","我常常睡不著、想東想西，耶穌能給我平安嗎？","子女不孝或家人關係不好，我怎麼放下心裡的怨氣？","我怕成為子女的負擔，這段經文怎麼看？","耶穌說信他的人有永生，永生是什麼意思？","我身體不好去不了教會，在家怎麼敬拜？","拜祖先和信耶穌會衝突嗎？怎麼孝敬已過世的父母？","我怎麼向老朋友、老鄰居分享耶穌的好？","信耶穌之後，平常的日子要怎麼過？","我想受洗，需要準備什麼？","臨終的時候，耶穌會怎麼陪伴我？家人可以怎麼做？","請教我一句記得住的話，每天用來向耶穌禱告。"],"zs":["年纪大了身体常常痛，这段经文怎么安慰我？","孩子都很忙，我常常觉得孤单，耶稣怎么陪伴我？","我怕死，也怕走了以后去哪里，耶稣怎么说？","老伴走了，我心里空空的，圣经有什么安慰？","我一辈子拜拜、拜祖先，现在信耶稣来得及吗？","儿孙不信耶稣，我可以为他们做什么？","我年轻时做过一些后悔的事，神还会原谅我吗？","我眼睛花了、不太识字，怎么听圣经、怎么祷告？","走到这个年纪，人生的意义是什么？神还要我做什么？","我常常睡不着、想东想西，耶稣能给我平安吗？","子女不孝或家人关系不好，我怎么放下心里的怨气？","我怕成为子女的负担，这段经文怎么看？","耶稣说信他的人有永生，永生是什么意思？","我身体不好去不了教会，在家怎么敬拜？","拜祖先和信耶稣会冲突吗？怎么孝敬已过世的父母？","我怎么向老朋友、老邻居分享耶稣的好？","信耶稣之后，平常的日子要怎么过？","我想受洗，需要准备什么？","临终的时候，耶稣会怎么陪伴我？家人可以怎么做？","请教我一句记得住的话，每天用来向耶稣祷告。"],"en":["I'm older and in pain often. How does this passage comfort me?","My children are busy and I feel lonely. How does Jesus keep me company?","I'm afraid of dying and of where I'll go. What does Jesus say?","My spouse has passed and my heart feels empty. What comfort does the Bible give?","I've worshipped idols and ancestors all my life. Is it too late to trust Jesus now?","My children and grandchildren don't believe. What can I do for them?","I did things when I was young that I regret. Will God forgive me?","My eyes are weak and I can't read well. How can I listen to the Bible and pray?","At this age, what is the meaning of life? What does God still want from me?","I often can't sleep and my mind races. Can Jesus give me peace?","My children are unkind or the family is strained. How do I let go of resentment?","I'm afraid of being a burden to my children. How does this passage see that?","Jesus says those who trust him have eternal life. What does that mean?","My health keeps me from church. How can I worship at home?","Does honouring ancestors conflict with following Jesus? How do I honour my late parents?","How can I share the goodness of Jesus with old friends and neighbours?","After I trust Jesus, how should ordinary days be lived?","I'd like to be baptised. What should I prepare?","At the end of life, how will Jesus be with me? What can my family do?","Teach me one easy sentence I can use to pray to Jesus every day."]},"single_parent":{"zh":["一個人又當爸又當媽，累到喘不過氣，耶穌怎麼幫我？","我常覺得對孩子有虧欠，這段經文怎麼安慰我？","經濟壓力很大，月底常常不知道怎麼辦，聖經有什麼盼望？","前任讓我很受傷，我很難原諒，怎麼放下？","孩子問「爸爸（媽媽）去哪裡了」，我怎麼回答？","孩子情緒不穩或叛逆，我怎麼用經文陪伴他？","我常覺得被人看不起、被貼標籤，神怎麼看我？","半夜孩子生病，我一個人慌了，禱告有用嗎？","我很孤單，沒有人可以商量，耶穌能怎麼陪我？","我還有機會再得到愛、或再婚嗎？聖經有什麼智慧？","我心裡對神有怨氣，為什麼我的家會破碎？","在忙碌中，怎麼帶孩子認識耶穌？","我怎麼教孩子禱告與讀聖經，又不給他壓力？","工作和照顧孩子分身乏術，怎麼不被愧疚壓垮？","離過婚的我，神還接納嗎？我有資格信耶穌嗎？","我想重新振作，耶穌能給我什麼新的開始？","我可以向誰求助？教會或信仰團體能怎麼支持我？","我怕孩子重蹈我的覆轍，怎麼給他安全感？","今天我只想要一句話撐下去，請給我一個盼望。","我想把這個家交給耶穌，要怎麼禱告？"],"zs":["一个人又当爸又当妈，累到喘不过气，耶稣怎么帮我？","我常觉得对孩子有亏欠，这段经文怎么安慰我？","经济压力很大，月底常常不知道怎么办，圣经有什么盼望？","前任让我很受伤，我很难原谅，怎么放下？","孩子问“爸爸（妈妈）去哪里了”，我怎么回答？","孩子情绪不稳或叛逆，我怎么用经文陪伴他？","我常觉得被人看不起、被贴标签，神怎么看我？","半夜孩子生病，我一个人慌了，祷告有用吗？","我很孤单，没有人可以商量，耶稣能怎么陪我？","我还有机会再得到爱、或再婚吗？圣经有什么智慧？","我心里对神有怨气，为什么我的家会破碎？","在忙碌中，怎么带孩子认识耶稣？","我怎么教孩子祷告与读圣经，又不给他压力？","工作和照顾孩子分身乏术，怎么不被愧疚压垮？","离过婚的我，神还接纳吗？我有资格信耶稣吗？","我想重新振作，耶稣能给我什么新的开始？","我可以向谁求助？教会或信仰团体能怎么支持我？","我怕孩子重蹈我的覆辙，怎么给他安全感？","今天我只想要一句话撑下去，请给我一个盼望。","我想把这个家交给耶稣，要怎么祷告？"],"en":["I'm both mom and dad and exhausted. How does Jesus help me?","I often feel I've let my child down. How does this passage comfort me?","Money is tight and I don't know how to get through month's end. What hope does the Bible give?","My ex hurt me deeply and I can't forgive. How do I let go?","My child asks, 'Where did Dad (or Mom) go?' How do I answer?","My child is moody or rebellious. How can I use Scripture to walk with them?","I often feel looked down on or labelled. How does God see me?","My child is sick in the middle of the night and I'm alone and panicking. Does prayer help?","I'm lonely with no one to talk to. How can Jesus be with me?","Is there still a chance for love or remarriage? What wisdom does the Bible give?","I'm angry at God — why did my family break apart?","In all this busyness, how do I help my child know Jesus?","How do I teach my child to pray and read the Bible without pressuring them?","Work and childcare stretch me thin. How do I keep guilt from crushing me?","I'm divorced. Does God still accept me? Am I qualified to trust Jesus?","I want to start again. What new beginning can Jesus give me?","Who can I turn to for help? How can a church or faith community support me?","I'm afraid my child will repeat my mistakes. How do I give them security?","Today I need just one sentence to get through. Please give me hope.","I want to hand this home over to Jesus. How do I pray?"]},"single":{"zh":["單身讓我有時很孤單，神怎麼看我的孤單？","家人一直催婚，我壓力很大，怎麼面對？","我想結婚卻遇不到對的人，神有為我預備嗎？","感情受過傷，我不敢再相信別人，怎麼療傷？","信仰不同的對象可以交往嗎？聖經怎麼說？","我很在意別人的眼光，覺得單身就是失敗，是真的嗎？","工作忙到沒有自己的生活，人生的意義是什麼？","我一個人也過得不錯，為什麼還需要神？","我怎麼分辨一個人適不適合？有什麼智慧？","我有情慾或網路上的掙扎，耶穌能幫我嗎？","我很怕老了一個人，聖經給我什麼安全感？","朋友都結婚生子了，我怎麼不羨慕、不比較？","單身的這段時間，神要我做什麼？","我對感情失望，也對神失望，可以誠實告訴他嗎？","我還不是基督徒，單身的我適合認識耶穌嗎？","我想信耶穌，但擔心生活被改變太多，會失去什麼？","怎麼交到真正的朋友，建立一個彼此支持的圈子？","我很容易焦慮，擔心沒有人愛我，耶穌的愛是什麼樣子？","神的愛是不需要條件的，我不相信有這種愛，怎麼辦？","如果我想把自己的人生交給耶穌，要怎麼開始？"],"zs":["单身让我有时很孤单，神怎么看我的孤单？","家人一直催婚，我压力很大，怎么面对？","我想结婚却遇不到对的人，神有为我预备吗？","感情受过伤，我不敢再相信别人，怎么疗伤？","信仰不同的对象可以交往吗？圣经怎么说？","我很在意别人的眼光，觉得单身就是失败，是真的吗？","工作忙到没有自己的生活，人生的意义是什么？","我一个人也过得不错，为什么还需要神？","我怎么分辨一个人适不适合？有什么智慧？","我有情欲或网路上的挣扎，耶稣能帮我吗？","我很怕老了一个人，圣经给我什么安全感？","朋友都结婚生子了，我怎么不羡慕、不比较？","单身的这段时间，神要我做什么？","我对感情失望，也对神失望，可以诚实告诉他吗？","我还不是基督徒，单身的我适合认识耶稣吗？","我想信耶稣，但担心生活被改变太多，会失去什么？","怎么交到真正的朋友，建立一个彼此支持的圈子？","我很容易焦虑，担心没有人爱我，耶稣的爱是什么样子？","神的爱是不需要条件的，我不相信有这种爱，怎么办？","如果我想把自己的人生交给耶稣，要怎么开始？"],"en":["Being single makes me lonely at times. How does God see my loneliness?","My family keeps pushing me to marry and I feel pressure. How do I face it?","I want to marry but haven't met the right person. Has God prepared someone?","I've been hurt in love and I can't trust again. How do I heal?","Can I date someone of a different faith? What does the Bible say?","I care too much what others think and feel single means failure. Is that true?","Work leaves me no life of my own. What is the meaning of life?","I'm fine on my own — why would I need God?","How do I tell whether someone is right for me? What wisdom is there?","I struggle with desire or things online. Can Jesus help me?","I'm afraid of growing old alone. What security does the Bible give?","My friends are all married with kids. How do I avoid envy and comparison?","What does God want me to do in this season of singleness?","I'm disappointed in love and in God. Can I be honest with him?","I'm not a Christian yet. Is it okay for me, single, to get to know Jesus?","I want to follow Jesus but worry my life would change too much. What would I lose?","How do I find real friends and build a circle that supports me?","I get anxious that no one will love me. What is Jesus' love like?","I don't believe love can be unconditional. What do I do with that?","If I want to give my life to Jesus, how do I begin?"]},"parent":{"zh":["孩子不愛讀書、整天滑手機，我很焦慮，怎麼辦？","孩子頂嘴叛逆，我很容易發火，這段經文怎麼幫我？","夫妻對教養孩子的意見不同，吵得很兇，怎麼辦？","我怎麼跟孩子說耶穌，才不會像說教？","孩子問「神在哪裡」「為什麼人會死」，我怎麼回答？","我常常對孩子大聲，事後很後悔，神會原諒我嗎？","擔心孩子被霸凌或交到壞朋友，我怎麼為他禱告？","孩子成績不理想，我怎麼不比較、不給他壓力？","工作與家庭很難平衡，我怕錯過孩子的成長，怎麼辦？","孩子生病或有特殊需要，我很自責，神怎麼看？","青春期的孩子不跟我說話，我怎麼重新靠近他？","我自己都做不好，怎麼當孩子的榜樣？","家裡有人不信耶穌，我怎麼在家中活出信仰？","怎麼帶孩子禱告、讀經，變成快樂的家庭習慣？","孩子偏離信仰、離開教會，我可以做什麼？","孩子問我「爸媽信耶穌，我一定要信嗎」，怎麼回答？","我怎麼教孩子面對失敗與失望？","我想給孩子最好的人生，聖經說最重要的是什麼？","我自己信得很淺，怎麼帶孩子認識耶穌？","為孩子的一生，我今天可以怎麼為他禱告？"],"zs":["孩子不爱读书、整天滑手机，我很焦虑，怎么办？","孩子顶嘴叛逆，我很容易发火，这段经文怎么帮我？","夫妻对教养孩子的意见不同，吵得很凶，怎么办？","我怎么跟孩子说耶稣，才不会像说教？","孩子问“神在哪里”“为什么人会死”，我怎么回答？","我常常对孩子大声，事后很后悔，神会原谅我吗？","担心孩子被霸凌或交到坏朋友，我怎么为他祷告？","孩子成绩不理想，我怎么不比较、不给他压力？","工作与家庭很难平衡，我怕错过孩子的成长，怎么办？","孩子生病或有特殊需要，我很自责，神怎么看？","青春期的孩子不跟我说话，我怎么重新靠近他？","我自己都做不好，怎么当孩子的榜样？","家里有人不信耶稣，我怎么在家中活出信仰？","怎么带孩子祷告、读经，变成快乐的家庭习惯？","孩子偏离信仰、离开教会，我可以做什么？","孩子问我“爸妈信耶稣，我一定要信吗”，怎么回答？","我怎么教孩子面对失败与失望？","我想给孩子最好的人生，圣经说最重要的是什么？","我自己信得很浅，怎么带孩子认识耶稣？","为孩子的一生，我今天可以怎么为他祷告？"],"en":["My child hates studying and is on the phone all day. I'm anxious — what do I do?","My child talks back and I lose my temper. How does this passage help me?","My spouse and I disagree about parenting and fight. What should we do?","How can I talk about Jesus with my child without sounding preachy?","My child asks, 'Where is God?' and 'Why do people die?' How do I answer?","I often shout at my child and regret it. Will God forgive me?","I fear my child will be bullied or fall in with bad friends. How do I pray for them?","My child's grades are poor. How do I avoid comparing and adding pressure?","Work and family are hard to balance and I fear missing my child's growing up. What can I do?","My child is ill or has special needs and I blame myself. How does God see this?","My teenager won't talk to me. How do I get close again?","I can't even get it right myself. How can I be a role model?","Someone at home doesn't believe. How do I live out my faith at home?","How do I turn prayer and Bible reading with my child into a happy family habit?","My child has drifted from faith or left church. What can I do?","My child asks, 'You believe in Jesus — do I have to?' How do I answer?","How do I teach my child to face failure and disappointment?","I want the best life for my child. What does the Bible say matters most?","My own faith is thin. How can I lead my child to know Jesus?","For my child's whole life, how can I pray for them today?"]},"couple":{"zh":["我們吵架後冷戰，誰該先開口？這段經文怎麼說？","對方的缺點讓我越來越受不了，怎麼辦？","錢的事常常吵，聖經給夫妻什麼智慧？","婆媳或岳父母的問題夾在中間，我該怎麼做？","另一半不信耶穌，我怎麼愛他，又不給他壓力？","我們很久沒有好好說話了，怎麼重新連結？","他（她）曾經傷害我，我真的能原諒嗎？","育兒讓我們都很累，怎麼不把怨氣發在彼此身上？","我覺得自己付出比較多、很委屈，耶穌怎麼教我？","夫妻個性不同，怎麼互補而不是互相消耗？","我們很不習慣一起禱告，怎麼開始？","我們對未來很不同調（搬家、工作），怎麼取得同心？","愛情變淡了，怎麼重新點燃？","我怕我們走不下去了，聖經對婚姻的盼望是什麼？","「順服」是不是就要完全聽對方的？","對方沉迷工作、手機或遊戲，我怎麼表達感受？","我們想建立一個有耶穌的家，第一步是什麼？","耶穌真的能改變我們的婚姻嗎？","兩個人只有一個人信耶穌，怎麼彼此尊重？","今晚我們可以一起做的一個小禱告是什麼？"],"zs":["我们吵架后冷战，谁该先开口？这段经文怎么说？","对方的缺点让我越来越受不了，怎么办？","钱的事常常吵，圣经给夫妻什么智慧？","婆媳或岳父母的问题夹在中间，我该怎么做？","另一半不信耶稣，我怎么爱他，又不给他压力？","我们很久没有好好说话了，怎么重新连结？","他（她）曾经伤害我，我真的能原谅吗？","育儿让我们都很累，怎么不把怨气发在彼此身上？","我觉得自己付出比较多、很委屈，耶稣怎么教我？","夫妻个性不同，怎么互补而不是互相消耗？","我们很不习惯一起祷告，怎么开始？","我们对未来很不同调（搬家、工作），怎么取得同心？","爱情变淡了，怎么重新点燃？","我怕我们走不下去了，圣经对婚姻的盼望是什么？","“顺服”是不是就要完全听对方的？","对方沉迷工作、手机或游戏，我怎么表达感受？","我们想建立一个有耶稣的家，第一步是什么？","耶稣真的能改变我们的婚姻吗？","两个人只有一个人信耶稣，怎么彼此尊重？","今晚我们可以一起做的一个小祷告是什么？"],"en":["We're in a cold war after a fight. Who should speak first? What does this passage say?","My spouse's flaws are getting harder to bear. What do I do?","We often fight about money. What wisdom does the Bible give a couple?","I'm caught between my spouse and in-laws. What should I do?","My spouse doesn't believe in Jesus. How do I love them without pressuring them?","We haven't really talked in a long time. How do we reconnect?","They hurt me. Can I truly forgive?","Parenting has exhausted us both. How do we avoid taking it out on each other?","I feel I give more and I'm resentful. How does Jesus teach me?","We're very different in temperament. How do we complement instead of drain each other?","We're not used to praying together. How do we begin?","We're out of step about the future (moving, work). How do we become one in heart?","Our love has cooled. How do we rekindle it?","I'm afraid we won't make it. What hope does the Bible give for marriage?","Does 'submission' mean I must simply obey my spouse?","My spouse is consumed by work, phone or games. How do I express how I feel?","We want a home that has Jesus at the centre. What is the first step?","Can Jesus really change our marriage?","Only one of us believes in Jesus. How do we respect each other?","What is one small prayer we can pray together tonight?"]},"pastor":{"zh":["這段經文放進主日講道，怎麼抓出一個清楚的大綱？","我很疲憊，怎麼在服事中不倦怠？","同工之間意見不合，我怎麼用經文帶領大家合一？","會友流失或人數停滯，我怎麼不焦慮、不比較？","我怎麼關懷一位還沒信、但開始來教會的朋友？","怎麼向不信的人清楚又溫柔地傳福音？","遇到對信仰有強烈質疑的慕道友（佛教、民間信仰、無神論），怎麼回應？","我怎麼預備一次決志的邀請，又不給人壓力？","我自己的靈命枯乾，怎麼重新得力？","面對教會的衝突或批評，我怎麼回應？","我怎麼栽培初信者，帶他們從信主走到成長？","怎麼培養同工與接班人？","如何平衡家庭與事奉，不虧欠家人？","我怎麼為一位臨終的人禱告，並安慰家屬？","有人想受洗，我怎麼預備受洗班與他的見證？","講道常被說太深或太淺，怎麼拿捏？","怎麼帶小組查經，讓還沒信的人也能參與？","我怎麼回應「為什麼好人受苦」這類難題？","忙碌的事工裡，我怎麼仍然「先生命、再關係、後事工」？","請給我一個今天可以帶會友禱告的簡短結尾。"],"zs":["这段经文放进主日讲道，怎么抓出一个清楚的大纲？","我很疲惫，怎么在服事中不倦怠？","同工之间意见不合，我怎么用经文带领大家合一？","会友流失或人数停滞，我怎么不焦虑、不比较？","我怎么关怀一位还没信、但开始来教会的朋友？","怎么向不信的人清楚又温柔地传福音？","遇到对信仰有强烈质疑的慕道友（佛教、民间信仰、无神论），怎么回应？","我怎么预备一次决志的邀请，又不给人压力？","我自己的灵命枯干，怎么重新得力？","面对教会的冲突或批评，我怎么回应？","我怎么栽培初信者，带他们从信主走到成长？","怎么培养同工与接班人？","如何平衡家庭与事奉，不亏欠家人？","我怎么为一位临终的人祷告，并安慰家属？","有人想受洗，我怎么预备受洗班与他的见证？","讲道常被说太深或太浅，怎么拿捏？","怎么带小组查经，让还没信的人也能参与？","我怎么回应“为什么好人受苦”这类难题？","忙碌的事工里，我怎么仍然“先生命、再关系、后事工”？","请给我一个今天可以带会友祷告的简短结尾。"],"en":["How do I draw a clear outline from this passage for Sunday's sermon?","I'm exhausted. How do I serve without burning out?","My co-workers disagree. How do I use Scripture to lead us into unity?","Members are leaving or numbers are flat. How do I avoid anxiety and comparison?","How do I care for a friend who isn't a believer yet but has started coming to church?","How do I share the gospel clearly and gently with someone who doesn't believe?","How do I respond to a seeker with strong objections (Buddhist, folk religion, atheist)?","How do I prepare an invitation to commit to Christ without pressuring people?","My own spiritual life is dry. How do I find strength again?","How do I respond to conflict or criticism in the church?","How do I disciple new believers from first faith into growth?","How do I raise up co-workers and successors?","How do I balance family and ministry without neglecting my family?","How do I pray for someone who is dying and comfort the family?","Someone wants to be baptised. How do I prepare the class and their testimony?","My sermons are said to be too deep or too shallow. How do I find the balance?","How do I lead a small-group Bible study that non-believers can join?","How do I answer hard questions like 'why do good people suffer?'","In busy ministry, how do I still put 'life first, relationships next, ministry last'?","Give me a short closing I can use today to lead members in prayer."]}},"QBANK20SK":{"buddhism":{"zh":["我習慣誦經、吃素，信耶穌需要放棄這些嗎？","佛教說苦是來自執著，聖經怎麼看人的苦？","佛教講因果報應，聖經說的「恩典」跟因果有什麼不同？","輪迴和聖經說的「人有一次生死，之後面對審判」差在哪裡？","佛教講眾生平等、慈悲為懷，耶穌也教人愛人嗎？","我拜佛是為了心安，耶穌給的平安有什麼不一樣？","佛陀和耶穌都是導師嗎？耶穌為什麼說自己是救主？","佛教講「放下」，聖經怎麼教人放下憂慮與怨恨？","我學過靜坐，基督教的默想禱告有什麼不同？","佛教強調自力修行，聖經為什麼說得救是靠恩典、不是靠行為？","聖經說神是創造主，跟佛教的「空」「緣起」有什麼不同？","我家人都信佛，我若信耶穌會讓他們傷心嗎？怎麼溝通？","親人往生要做功德迴向，基督徒怎麼看亡者與追思？","我做過不少善事，為什麼還說我需要被拯救？","佛教說人人有佛性，聖經怎麼看人的本性與罪？","為什麼耶穌的死能赦免我的罪？跟「業」有什麼關係？","「涅槃」和聖經說的「永生」「天堂」一樣嗎？","學佛的人可以同時信耶穌嗎？為什麼聖經強調獨一真神？","我想了解耶穌，可以先從哪一卷、哪一段讀起？","如果我願意試著向耶穌禱告，第一句話可以怎麼說？"],"zs":["我习惯诵经、吃素，信耶稣需要放弃这些吗？","佛教说苦是来自执着，圣经怎么看人的苦？","佛教讲因果报应，圣经说的“恩典”跟因果有什么不同？","轮回和圣经说的“人有一次生死，之后面对审判”差在哪里？","佛教讲众生平等、慈悲为怀，耶稣也教人爱人吗？","我拜佛是为了心安，耶稣给的平安有什么不一样？","佛陀和耶稣都是导师吗？耶稣为什么说自己是救主？","佛教讲“放下”，圣经怎么教人放下忧虑与怨恨？","我学过静坐，基督教的默想祷告有什么不同？","佛教强调自力修行，圣经为什么说得救是靠恩典、不是靠行为？","圣经说神是创造主，跟佛教的“空”“缘起”有什么不同？","我家人都信佛，我若信耶稣会让他们伤心吗？怎么沟通？","亲人往生要做功德回向，基督徒怎么看亡者与追思？","我做过不少善事，为什么还说我需要被拯救？","佛教说人人有佛性，圣经怎么看人的本性与罪？","为什么耶稣的死能赦免我的罪？跟“业”有什么关系？","“涅槃”和圣经说的“永生”“天堂”一样吗？","学佛的人可以同时信耶稣吗？为什么圣经强调独一真神？","我想了解耶稣，可以先从哪一卷、哪一段读起？","如果我愿意试着向耶稣祷告，第一句话可以怎么说？"],"en":["I chant and eat vegetarian. Do I have to give these up to follow Jesus?","Buddhism says suffering comes from attachment. How does the Bible see human suffering?","Buddhism teaches karma. How is the Bible's 'grace' different from cause and effect?","How is reincarnation different from the Bible's 'one life, then judgement'?","Buddhism teaches equality and compassion. Does Jesus teach loving others too?","I worship the Buddha for peace of mind. How is the peace Jesus gives different?","Are the Buddha and Jesus both teachers? Why does Jesus call himself Saviour?","Buddhism speaks of 'letting go'. How does the Bible teach letting go of worry and resentment?","I've practised meditation. How is Christian contemplative prayer different?","Buddhism stresses self-effort. Why does the Bible say we're saved by grace, not works?","The Bible says God is Creator. How is that different from 'emptiness' and 'dependent origination'?","My family are all Buddhists. Would following Jesus hurt them? How do I talk with them?","When a loved one dies we do merit-transfer. How do Christians see the dead and remembrance?","I've done many good deeds. Why does the Bible say I need to be saved?","Buddhism says everyone has Buddha-nature. How does the Bible see human nature and sin?","Why can Jesus' death forgive my sins? How does that relate to karma?","Is 'nirvana' the same as the Bible's 'eternal life' and 'heaven'?","Can a Buddhist follow Jesus at the same time? Why does the Bible stress one true God?","I want to know Jesus. Which book or passage should I read first?","If I'm willing to try praying to Jesus, what can I say as a first sentence?"]},"folk":{"zh":["我家拜拜、拜祖先，信耶穌就不能拜了嗎？為什麼？","我拜神明是求平安、求保佑，耶穌可以給我這些嗎？","聖經教人孝敬父母，信耶穌會不會變成不孝？","清明、中元要祭拜祖先，基督徒可以怎麼追思、表達孝心？","我家神桌上有好多神明，到底哪一位才是真的？","算命、拜太歲、改運，聖經怎麼看？","風水和廟裡的籤準不準？信耶穌的人怎麼面對未知的事？","我生意不順，朋友教我拜財神，耶穌怎麼幫我？","家裡有人生病，有人說要收驚、問神，我該怎麼做？","我怕得罪神明、遭報應，信了耶穌，這些恐懼怎麼辦？","我爸媽反對我去教會，怎麼溝通才不傷感情？","媽祖、關公這些神明，聖經怎麼看？他們是真的嗎？","為什麼說只有一位真神？其他的神明難道都是假的？","過世的親人在另一個世界過得好嗎？我能為他們做什麼？","我過去拜過很多廟，神會不會嫌棄我？","家人的婚喪喜慶都要拜拜，我信耶穌怎麼參加才不尷尬？","我家有神像、符咒，信主後要怎麼處理？","耶穌能保佑我平安嗎？跟神明保佑有什麼不一樣？","我想了解耶穌，要先去教會，還是自己先讀聖經？","我想向耶穌禱告，需要燒香、擺供品嗎？怎麼禱告？"],"zs":["我家拜拜、拜祖先，信耶稣就不能拜了吗？为什么？","我拜神明是求平安、求保佑，耶稣可以给我这些吗？","圣经教人孝敬父母，信耶稣会不会变成不孝？","清明、中元要祭拜祖先，基督徒可以怎么追思、表达孝心？","我家神桌上有好多神明，到底哪一位才是真的？","算命、拜太岁、改运，圣经怎么看？","风水和庙里的签准不准？信耶稣的人怎么面对未知的事？","我生意不顺，朋友教我拜财神，耶稣怎么帮我？","家里有人生病，有人说要收惊、问神，我该怎么做？","我怕得罪神明、遭报应，信了耶稣，这些恐惧怎么办？","我爸妈反对我去教会，怎么沟通才不伤感情？","妈祖、关公这些神明，圣经怎么看？他们是真的吗？","为什么说只有一位真神？其他的神明难道都是假的？","过世的亲人在另一个世界过得好吗？我能为他们做什么？","我过去拜过很多庙，神会不会嫌弃我？","家人的婚丧喜庆都要拜拜，我信耶稣怎么参加才不尴尬？","我家有神像、符咒，信主后要怎么处理？","耶稣能保佑我平安吗？跟神明保佑有什么不一样？","我想了解耶稣，要先去教会，还是自己先读圣经？","我想向耶稣祷告，需要烧香、摆供品吗？怎么祷告？"],"en":["My family worships deities and ancestors. If I follow Jesus can I no longer do that? Why?","I worship the gods for peace and protection. Can Jesus give me those?","The Bible teaches honouring parents. Would following Jesus make me unfilial?","At Qingming and Ghost Month we honour ancestors. How can a Christian remember them and show respect?","Our altar has many gods. Which one is real?","Fortune-telling, praying to the Grand Duke, changing luck — what does the Bible say?","Are feng shui and temple divination accurate? How do people who follow Jesus face the unknown?","My business is struggling and a friend says worship the wealth god. How does Jesus help me?","Someone at home is sick and people say do a soul-calling ritual or consult a deity. What should I do?","I'm afraid of offending the gods and being punished. What happens to that fear if I follow Jesus?","My parents oppose my going to church. How do I talk with them without hurting them?","What does the Bible say about Mazu, Guan Gong and such? Are they real?","Why only one true God? Are all the other gods false?","Are my departed relatives doing well in the next world? What can I do for them?","I've worshipped at many temples. Will God reject me?","Weddings and funerals in my family involve worship. How can I join without awkwardness if I follow Jesus?","We have idols and charms at home. What do I do with them after I believe?","Can Jesus protect me? How is that different from the gods' protection?","I want to know Jesus. Should I go to church first, or read the Bible on my own first?","I want to pray to Jesus. Do I need incense or offerings? How do I pray?"]},"yiguandao":{"zh":["我吃素、重視修身行善，信耶穌需要改變這些嗎？","一貫道說「五教同源、萬教歸一」，耶穌為什麼說自己是唯一的道路？","我們敬拜「天」，聖經的「上帝」是同一位嗎？","一貫道講修道成聖，聖經的「得救」靠修行還是靠恩典？","道場裡講三期末劫，聖經對末世和審判怎麼說？","向耶穌禱告需要什麼儀式嗎？跟我們敬天禮神有什麼不同？","聖經裡的耶穌，跟道場裡說的耶穌（五教聖人之一）一樣嗎？","我在道場很投入，若轉而認識耶穌，是不是背叛師尊與道親？","道親都是好人，為什麼聖經還說人人有罪、需要救主？","我們講「明明上帝」「回天」，聖經的天堂與永生是什麼？","我們求道、上香，聖經說的敬拜是什麼樣子？","為什麼聖經說耶穌是神的兒子？這跟人修成神仙有什麼不同？","我的家人都在道場，我怎麼說出想了解耶穌的心意？","一貫道重孝道與倫理，聖經在家庭倫理上教導什麼？","道場有「求道」「點傳」，信耶穌要受洗，兩者有什麼不同？","我在道場裡曾經感到平安，耶穌給的平安有什麼不同？","我過去的修持和行善，在神面前算什麼？","我心裡有疑問，又怕被說信心不夠，可以誠實問嗎？","我想了解耶穌，從哪一段聖經開始最合適？","如果我向耶穌禱告，需要先離開道場嗎？第一句可以怎麼說？"],"zs":["我吃素、重视修身行善，信耶稣需要改变这些吗？","一贯道说“五教同源、万教归一”，耶稣为什么说自己是唯一的道路？","我们敬拜“天”，圣经的“上帝”是同一位吗？","一贯道讲修道成圣，圣经的“得救”靠修行还是靠恩典？","道场里讲三期末劫，圣经对末世和审判怎么说？","向耶稣祷告需要什么仪式吗？跟我们敬天礼神有什么不同？","圣经里的耶稣，跟道场里说的耶稣（五教圣人之一）一样吗？","我在道场很投入，若转而认识耶稣，是不是背叛师尊与道亲？","道亲都是好人，为什么圣经还说人人有罪、需要救主？","我们讲“明明上帝”“回天”，圣经的天堂与永生是什么？","我们求道、上香，圣经说的敬拜是什么样子？","为什么圣经说耶稣是神的儿子？这跟人修成神仙有什么不同？","我的家人都在道场，我怎么说出想了解耶稣的心意？","一贯道重孝道与伦理，圣经在家庭伦理上教导什么？","道场有“求道”“点传”，信耶稣要受洗，两者有什么不同？","我在道场里曾经感到平安，耶稣给的平安有什么不同？","我过去的修持和行善，在神面前算什么？","我心里有疑问，又怕被说信心不够，可以诚实问吗？","我想了解耶稣，从哪一段圣经开始最合适？","如果我向耶稣祷告，需要先离开道场吗？第一句可以怎么说？"],"en":["I'm vegetarian and value self-cultivation and good deeds. Must I change these to follow Jesus?","Yiguandao says 'five religions share one source'. Why does Jesus say he is the only way?","We worship 'Heaven'. Is the Bible's 'God' the same one?","Yiguandao speaks of cultivating the Way to become a saint. Is 'salvation' by effort or by grace?","Our hall teaches the three ages of calamity. What does the Bible say about the end and judgement?","Does praying to Jesus need rituals? How is it different from how we honour Heaven?","Is the Jesus of the Bible the same as the Jesus in our hall (one of the five sages)?","I'm deeply involved in our hall. If I come to know Jesus, am I betraying my teachers and fellow believers?","My fellow believers are good people. Why does the Bible say everyone has sin and needs a Saviour?","We speak of 'the Lord on High' and 'returning to Heaven'. What are heaven and eternal life in the Bible?","We seek the Way and burn incense. What does worship look like in the Bible?","Why does the Bible say Jesus is the Son of God? How is that different from a person cultivating into a deity?","My family are all in the hall. How do I tell them I want to understand Jesus?","Yiguandao values filial piety and ethics. What does the Bible teach about family?","Our hall has 'seeking the Way' and 'the transmitting master'. Following Jesus involves baptism. What's the difference?","I once felt peace in the hall. How is the peace Jesus gives different?","What do my past practice and good deeds count for before God?","I have doubts but fear being told my faith is weak. May I ask honestly?","I want to know Jesus. Which part of the Bible is best to start with?","If I pray to Jesus, must I leave the hall first? What can I say as a first sentence?"]},"muslim":{"zh":["我信真主獨一，基督徒說的「三位一體」是不是信三個神？","我們尊敬爾薩（耶穌），聖經為什麼說他是神的兒子？","古蘭經和聖經都提到亞伯拉罕、摩西，兩者有什麼不同？","穆斯林靠五功和行善盼望進天堂，聖經為什麼說得救是靠恩典？","耶穌真的被釘十字架而死嗎？為什麼需要他的死？","有人說聖經被更改了，聖經可靠嗎？有什麼根據？","耶穌復活有什麼歷史根據？","我每天禮拜五次，基督徒怎麼禱告？一定要固定的方式嗎？","我犯了罪，真主赦免靠什麼？聖經說的赦免是什麼？","我若對耶穌有興趣，家人和社群會怎麼看？我怎麼保護自己與家人的關係？","我可以只讀聖經來認識耶穌，不與家人爭論嗎？","聖經怎麼說耶穌的身分？只是先知，還是更多？","聖經說神是愛，我熟悉真主的慈憫，兩者有什麼異同？","基督徒喝酒、吃豬肉嗎？聖經對飲食的教導是什麼？","末日審判的時候，我怎麼才有把握得救？","「道成肉身」是什麼意思？神怎麼可能成為人？","基督徒怎麼看聖戰與暴力？耶穌怎麼教導人對待仇敵？","我從小受穆斯林教育，如果我信耶穌，是不是背叛？","我可以怎麼安靜地讀約翰福音，認識耶穌？","如果我想向耶穌禱告，可以用自己的話嗎？第一句怎麼說？"],"zs":["我信真主独一，基督徒说的“三位一体”是不是信三个神？","我们尊敬尔萨（耶稣），圣经为什么说他是神的儿子？","古兰经和圣经都提到亚伯拉罕、摩西，两者有什么不同？","穆斯林靠五功和行善盼望进天堂，圣经为什么说得救是靠恩典？","耶稣真的被钉十字架而死吗？为什么需要他的死？","有人说圣经被更改了，圣经可靠吗？有什么根据？","耶稣复活有什么历史根据？","我每天礼拜五次，基督徒怎么祷告？一定要固定的方式吗？","我犯了罪，真主赦免靠什么？圣经说的赦免是什么？","我若对耶稣有兴趣，家人和社群会怎么看？我怎么保护自己与家人的关系？","我可以只读圣经来认识耶稣，不与家人争论吗？","圣经怎么说耶稣的身分？只是先知，还是更多？","圣经说神是爱，我熟悉真主的慈悯，两者有什么异同？","基督徒喝酒、吃猪肉吗？圣经对饮食的教导是什么？","末日审判的时候，我怎么才有把握得救？","“道成肉身”是什么意思？神怎么可能成为人？","基督徒怎么看圣战与暴力？耶稣怎么教导人对待仇敌？","我从小受穆斯林教育，如果我信耶稣，是不是背叛？","我可以怎么安静地读约翰福音，认识耶稣？","如果我想向耶稣祷告，可以用自己的话吗？第一句怎么说？"],"en":["I believe God is one. Isn't the Christian 'Trinity' belief in three gods?","We honour Isa (Jesus). Why does the Bible say he is the Son of God?","The Qur'an and the Bible both mention Abraham and Moses. How do they differ?","Muslims hope for paradise through the five pillars and good deeds. Why does the Bible say salvation is by grace?","Was Jesus really crucified and killed? Why was his death needed?","Some say the Bible was altered. Is it reliable? What is the evidence?","What historical evidence is there for the resurrection of Jesus?","I pray five times a day. How do Christians pray? Must it be in a fixed form?","I have sinned. How does God forgive according to my tradition, and what is forgiveness in the Bible?","If I'm interested in Jesus, how will my family and community see it? How do I protect myself and my family ties?","Can I read only the Bible to get to know Jesus, without arguing with my family?","What does the Bible say about Jesus' identity? Only a prophet, or more?","The Bible says God is love. I know God's mercy well. How are they alike and different?","Do Christians drink alcohol or eat pork? What does the Bible teach about food?","On the Day of Judgement, how can I be sure of being saved?","What does 'the Word became flesh' mean? How could God become a man?","How do Christians see holy war and violence? How did Jesus teach people to treat enemies?","I was raised Muslim. If I follow Jesus, is that betrayal?","How can I quietly read the Gospel of John to get to know Jesus?","If I want to pray to Jesus, may I use my own words? What is a first sentence?"]},"atheist":{"zh":["科學已經能解釋宇宙的起源，為什麼還需要神？","進化論和聖經的創造是不是互相衝突？","我沒有看過神，有什麼證據證明神存在？","如果神是全能又全愛，為什麼有戰爭、疾病和災難？","道德不靠宗教也可以，為什麼還需要信仰？","歷史上有十字軍與宗教戰爭，這不是信仰的問題嗎？","聖經裡有些故事（如神蹟）看起來不合理，我要怎麼讀？","耶穌在歷史上真的存在嗎？有哪些歷史記載？","耶穌復活有什麼歷史根據？難道不是門徒編出來的？","信仰是不是只是心理安慰、逃避現實？","人死了就結束，不是更簡單嗎？為什麼要談永生？","人生的意義如果沒有神，是從哪裡來的？","基督徒怎麼面對自己的疑問與懷疑？可以提出來問嗎？","我看過一些基督徒言行不一，這是不是證明信仰是假的？","「信」是不是就是放棄思考？","如果我想認真認識耶穌，要用什麼態度、先看什麼？","禱告真的有用嗎？有沒有可以自己驗證的方法？","為什麼說人有「罪」？我不覺得自己犯了什麼大錯。","耶穌的教導有什麼獨特之處，值得認真考慮？","我還在懷疑，但願意試著開口禱告一次，可以怎麼說？"],"zs":["科学已经能解释宇宙的起源，为什么还需要神？","进化论和圣经的创造是不是互相冲突？","我没有看过神，有什么证据证明神存在？","如果神是全能又全爱，为什么有战争、疾病和灾难？","道德不靠宗教也可以，为什么还需要信仰？","历史上有十字军与宗教战争，这不是信仰的问题吗？","圣经里有些故事（如神迹）看起来不合理，我要怎么读？","耶稣在历史上真的存在吗？有哪些历史记载？","耶稣复活有什么历史根据？难道不是门徒编出来的？","信仰是不是只是心理安慰、逃避现实？","人死了就结束，不是更简单吗？为什么要谈永生？","人生的意义如果没有神，是从哪里来的？","基督徒怎么面对自己的疑问与怀疑？可以提出来问吗？","我看过一些基督徒言行不一，这是不是证明信仰是假的？","“信”是不是就是放弃思考？","如果我想认真认识耶稣，要用什么态度、先看什么？","祷告真的有用吗？有没有可以自己验证的方法？","为什么说人有“罪”？我不觉得自己犯了什么大错。","耶稣的教导有什么独特之处，值得认真考虑？","我还在怀疑，但愿意试着开口祷告一次，可以怎么说？"],"en":["Science can explain the origin of the universe. Why do we still need God?","Does evolution conflict with the Bible's creation?","I've never seen God. What evidence is there that he exists?","If God is all-powerful and all-loving, why are there wars, disease and disasters?","Morality doesn't need religion. Why do we still need faith?","History has the Crusades and religious wars. Isn't that the problem with 流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。","kid":" 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後邀請孩子用自己的話跟耶穌說一句話，或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。","seeker":" 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。","elder":" 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。","single_parent":" 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。","single":" 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。","parent":" 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。","couple":" 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。","pastor":" 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。"},"zs":{"adult":" 回答对象：成年人。请用成熟、沉稳而温暖的口吻，可以有适度的深度：点出经文脉络与关键字词的意思，连结工作、婚姻、教养、人际与属灵争战，最后带出一个这星期就能操练的具体步骤。","teen":" 回答对象：青少年（约12–18岁）。请用幽默风趣、轻松有梗的口吻，像一位很酷的大哥哥大姐姐在聊天，不说教、不居高临下。多用他们熟悉的世界来比喻：手机剩1%电量、游戏过关、追剧、社交平台点赞与粉丝、考试、同侪压力、打球。可以适度用一点流行说法和小玩笑，但绝不拿圣经、神或耶稣开玩笑，也不轻看罪与伤痛；笑完一定要回到经文的真理上。答案精简，重点先讲，段落要短，结尾给一个今天就能试的小挑战。若他提到被欺负、受伤害或想伤害自己，要温柔回应，并鼓励他马上告诉信任的大人（爸妈、老师、牧者）。","kid":" 回答对象：儿童（约5–11岁）。请用非常浅显易懂的话，像说故事给小朋友听。句子要短，一句只讲一件事；用具体的小事当比喻（种子、小熊、手牵手、捉迷藏、生日蛋糕）；不用艰深的神学名词，必须用时马上用一句话解释。语气亲切活泼，可以说「你知道吗？」「一起想一想」，并适度加几个可爱的表情符号。整个回答控制在五到七句短句。不要用表格；只引用一节简短的经文。遇到暴力或可怕的经文，用孩子能承受的方式温柔带过，不渲染细节。最后邀请孩子用自己的话跟耶稣说一句话，或一个孩子答得出来的简单问题作结。若孩子说有人伤害他、或他很难过，要亲切回应，并告诉他马上跟信任的大人（爸爸妈妈、老师、牧者）说。","seeker":" 回答对象：慕道友（还没有信主、正在了解基督信仰的朋友）。请完全站在他的立场和角度：他可能没读过圣经、不懂教会用语，心里有疑问，甚至有些保留。①先从他真实的生活处境、感受或疑问切入，再带到经文，让他觉得“这跟我有关”。②用最平常的话说；321理念只是你心里的方向，不要在回答里出现“无己、作王、得胜、属灵”这类内部用语，也不用教会与神学术语；一定要提到的词（如恩典、罪、救恩），马上用生活的说法解释。③诚实、尊重、不说教、不施压、不要求他现在就相信，也不论断他；有疑问或质疑很正常，先认真承认那个问题的份量，再诚实回答。④清楚说出圣经在这件事上的真理（神是怎样的神、耶稣为我们做了什么），用故事、比喻和日常例子，让他听得懂、记得住。⑤一定要有实際有用的帮助：给一两个他这个星期就能自己试试看的小步驟（一个观察、一个提问、一个簡单的行动）。⑥合适时，可以温和邀请他继续探索（例如读一小段、问一个问题），不要硬把话题转到决志。⑦不要说“我们基督徒都知道”这类预设他已经信的话。引用经文用和合本，并用白话解释他的意思。若写到祷告，只当作“若你愿意，可以这样对神说”的邀请，不强迫。整个回答要簡明、段落要短。","elder":" 回答对象：长辈（约65岁以上）。请用尊敬、温和、慢慢说的口吻，像晚辈敬重地陪长辈读经；句子清楚、不拐弯，不用网路用语和英文缩写；比喻取自一生的阅历（田地、家人、岁月、病痛、孙子、老街坊）。重点先讲，分成短段落，不要太长。肯定他们一生走过的路与在主里的忠心，不说教、不指责、不用「你应该」。可以谈健康与软弱、孤单、放下与交托、把信仰传给下一代、永恒的盼望与感恩。结尾给一件简单、容易做到的小事（一句祷告、打电话问候家人、数算一件感谢）。若提到身体不适、孤单或失去亲人，要先温柔安慰，并鼓励他和家人、教会关怀同工联络。","single_parent":" 回答对象：单亲爸爸或妈妈（一个人撑起一个家）。请先接住他的辛苦：他常常很累、有愧疚、有孤单，也有经济、时间与教养的压力。口吻温暖、接纳、不评断，不追问过去的原因，不说「你应该再找个伴」，也不把单亲说成缺憾。引用神的心意：神是孤儿的父、寡妇的伸冤者（诗篇68:5），祂与我们同在。再给盼望与实际：每一个小步骤都要在忙碌中做得到（五分钟祷告、跟孩子的一个小仪式、开口向弟兄姐妹求助）。内容简短、段落要短。结尾给一个这个星期做得到的小步骤。若他提到被暴力对待、疲惫到撑不下去或想伤害自己，要温柔回应，并鼓励他立刻联络信任的人、教会同工或专业协助。","single":" 回答对象：单身的人（可能未婚、离婚、丧偶，或正在等候；不要预设他想结婚或不想结婚）。请不要把单身说成缺憾、「预备期」或「还没到的人生」，也不要用催婚的口气。谈在基督里的身分已经完整、被爱；谈孤单时怎么与神、与朋友、与团契连结；谈时间、金钱与恩赐的运用与使命；谈等待中的信靠；谈感情与婚姻的智慧，以及在情感与身体上的圣洁，态度要尊重、不论断。口吻真诚、平等、轻松。结尾给一个这个星期可以做的小步骤。若他提到孤单到想伤害自己，要温柔回应并鼓励他立刻联络信任的人或专业协助。","parent":" 回答对象：正在养育孩子的父母（孩子可能从婴幼儿到成年）。请站在父母的位置：他们常常疲累、担心孩子、也常常内疚。口吻温暖、贴近生活、不评断；承认每个孩子与每个家庭都不同。谈陪伴与榜样、管教与恩典的平衡、亲子沟通（怎么听、怎么说）、为孩子祷告、夫妻同心、面对自己的软弱与失败；可用日常场景当比喻（吃饭、功课、手机、睡前）。结尾给一个这个星期可以做的具体小步骤（一句话、一个拥抱、一段睡前祷告）。若提到孩子遭受伤害、家庭暴力或孩子有自伤的念头，要温柔回应并鼓励立刻寻求专业协助与信任的人。","couple":" 回答对象：夫妻（正在经营婚姻的丈夫与妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。请站在夫妻同行的位置：口吻温暖、真诚、不评断，不偏袒任何一方；承认每段婚姻都有磨合、疲累与受伤的时候。谈爱是决定与付出、彼此饶恕、倾听与表达（怎么说、怎么听）、尊重与同心、金钱与家务的分工、姻亲与孩子的教养、一起祷告与一起读经、在主里成为一体；可用日常场景当比喻（饭桌、手牵手、吵完架之后、睡前）。结尾给一个这个星期两个人就能一起做的具体小步骤（一句感谢的话、一段两人的祷告、一次不看手机的散步）。不要教导妻子顺服或丈夫掌权的单方面要求，要强调彼此相爱、彼此顺服。若提到家庭暴力、外遇、对方的威胁或有自伤念头，要温柔回应，把安全放在第一位，并鼓励立刻寻求专业协助与信任的人，不要劝人一味忍耐。","pastor":" 回答对象：牧者与传道同工（教会的牧师、传道人、小组长与事奉的同工）。请站在同工的位置：他们常常肩负许多人的重担，自己也会疲累、孤单、被误解或灰心。口吻尊重、平等、真诚，像同工之间彼此扶持，不说教、不居高临下。可以有适度的深度：点出经文脉络、原文语境与关键字词的意思，谈牧养羊群与生命建造、预备讲道与教导、带领小组与门徒训练、团队同心与冲突、面对批评与孤单、属灵争战、自己的灵命与家庭，以及不倦怠的安息与依靠；也可提供讲章或查经的切入点、段落与应用建议，但要提醒最后仍须自己在神面前领受。结尾给一个这个星期可以做的具体小步骤（一段安静亲近神的时间、一通关心的电话、一次向同工的坦诚分享）。若提到极度疲惫、忧郁、想放弃或有自伤念头，要温柔回应，并鼓励立刻寻求信任的同工、属灵长辈与专业协助。"},"en":{"adult":" Audience: an adult. Speak with a mature, steady and warm voice. You may go a little deeper — note the context and the meaning of key words — and connect the passage to work, marriage, parenting, relationships and spiritual battle. Close with one concrete step the reader can practise this week.","teen":" Audience: a teenager (about 12–18). Be funny, witty and real — like a cool older brother or sister chatting, never lecturing or talking down. Use pictures from their world: phone at 1% battery, game levels, binge-watching, likes and followers, exams, peer pressure, sports. A light joke or current slang now and then is welcome, but NEVER joke about God, Jesus or Scripture itself, and never be flippant about sin or pain; after the laugh, land firmly on the truth. Keep it short, put the main point first, use short paragraphs, and end with one small challenge they can try today. If they mention being hurt, bullied, or wanting to harm themselves, answer gently and encourage them to tell a trusted adult (parent, teacher, pastor) right away.","kid":" Audience: a young child (about 5–11). Use VERY simple words, like telling a story to a little one. Short sentences, one idea each. Use concrete everyday pictures (a seed, a teddy bear, holding hands, hide-and-seek, a birthday cake). Avoid theological terms; if one is needed, explain it in one simple sentence. Be warm and lively — you may ask \"Did you know?\" or \"Let's think!\" and add a few cute emojis. Keep the whole answer to about 5–7 short sentences. Do NOT use tables. Quote only one short verse. For violent or frightening passages, tell it gently without graphic detail. End by inviting the child to say a few words to Jesus in their own words, or one simple question the child can answer. If the child says someone hurts them or they are very sad, answer kindly and tell them to talk to a trusted grown-up (mom, dad, teacher, pastor) right away.","seeker":" Audience: a seeker — a friend who is not yet a believer and is exploring the Christian faith. Stand fully in their shoes: they may never have read the Bible, do not know church language, and may have questions or reservations. (1) Start from their real situation, feelings or question, then bring in the passage, so they feel \"this is about me\". (2) Use plain everyday words; the 321 vision is only your inner compass — never use insider words like \"self-emptied\", \"let Jesus reign\", \"overcomer\" or \"spiritual\", and no church or theological jargon; if a word like grace, sin or salvation is unavoidable, explain it at once in everyday terms. (3) Be honest and respectful — no preaching, no pressure, no demand to believe now, no judging; doubts and objections are normal, so acknowledge the weight of the question first, then answer it honestly. (4) State clearly what the Bible says about it (what God is like, what Jesus did for us) through stories, pictures and everyday examples they can understand and remember. (5) Always give practical help: one or two small steps they can try this week by themselves (something to notice, a question to ask, a simple action). (6) When it fits, gently invite them to keep exploring (read a short passage, ask a question) — never force the conversation toward a decision. (7) Never say things like \"we Christians all know\", which assumes they already believe. Quote the World English Bible and explain it in plain words. If you include a prayer, offer it only as \"if you like, you could say something like this to God\" — never forced. Keep the whole answer concise, with short paragraphs.","elder":" Audience: an elder (about 65 and older). Speak respectfully, gently and unhurriedly, like a younger person reading Scripture with an older one they honour. Short, clear sentences; no internet slang or abbreviations; pictures from a long life (fields, family, the years, illness, grandchildren, old neighbours). Main point first, in short paragraphs. Honour the road they have walked and their faithfulness in the Lord; never preach, scold, or say \"you should\". You may speak of health and frailty, loneliness, letting go and entrusting, passing faith to the next generation, eternal hope and gratitude. End with one simple thing that is easy to do (a short prayer, a phone call to family, counting one blessing). If they mention illness, loneliness or loss, comfort them first and encourage them to reach out to family or the church care team.","single_parent":" Audience: a single parent (carrying a household alone). First receive their weariness: they are often exhausted, carry guilt and loneliness, and face pressure over money, time and raising children. Be warm, accepting and non-judging; do not ask why they are single, never say \"you should find a partner\", and never describe single parenting as a lack. Bring in God's heart: he is a father to the fatherless and a defender of widows (Psalm 68:5), and he is with us. Then give hope and practicality — every small step must be doable in a busy life (a five-minute prayer, one small ritual with the child, asking brothers and sisters for help). Keep it short, in short paragraphs. End with one step they can take this week. If they mention being abused, being too exhausted to go on, or wanting to harm themselves, answer gently and encourage them to contact someone they trust, a church worker or professional help right away.","single":" Audience: a single person (never married, divorced, widowed, or still waiting — do not assume they want or do not want to marry). Never describe being single as a lack, a \"preparation stage\" or \"life not yet begun\", and never use a pushy-about-marriage tone. Speak of an identity in Christ that is already whole and loved; of connecting with God, friends and fellowship in loneliness; of using time, money and gifts for a purpose; of trusting while waiting; of wisdom in dating and marriage and of purity in heart and body, respectfully and without judging. Be sincere, equal and light. End with one step they can take this week. If they mention loneliness so deep they want to harm themselves, answer gently and encourage them to contact someone they trust or professional help right away.","parent":" Audience: a parent raising children (from babies to adult children). Stand in the parent's shoes: they are often tired, worried about their children, and often feel guilty. Be warm, down-to-earth and non-judging; acknowledge that every child and every family is different. Speak of presence and example, balancing discipline and grace, parent–child communication (how to listen, how to speak), praying for children, husband and wife standing together, and facing one's own weakness and failure; use everyday scenes as pictures (mealtime, homework, phones, bedtime). End with one concrete step for this week (one sentence, a hug, a bedtime prayer). If a child is being harmed, there is domestic violence, or the child has thoughts of self-harm, answer gently and encourage seeking professional help and a trusted person right away.","couple":" Audience: a married couple (husband and wife — newlyweds, parents in the thick of life, or long-time partners). Stand beside them as a fellow traveler: warm, sincere, never judging and never taking one side; admit every marriage has seasons of friction, weariness and hurt. Speak of love as a decision and a gift, forgiving one another, listening and speaking well, respect and unity, money and household work, in-laws and raising children, praying and reading Scripture together, becoming one in the Lord. Use everyday pictures (the dinner table, holding hands, after an argument, bedtime). Close with one small step the two of them can do together this week (a word of thanks, a short prayer together, a phone-free walk). Never lay one-sided demands on the wife to submit or the husband to rule; stress mutual love and mutual submission. If domestic violence, an affair, threats or thoughts of self-harm come up, respond gently, put safety first, and encourage reaching out at once to professionals and trusted people — never urge someone just to endure.","pastor":" Audience: a pastor or ministry worker (pastor, preacher, small-group leader, church staff or volunteer). Stand beside them as a fellow worker: they carry many people's burdens and can themselves be weary, lonely, misunderstood or discouraged. Be respectful, equal and sincere — never lecturing or talking down. You may go deeper: the context of the passage, the sense of key words, shepherding and building lives, sermon and lesson preparation, leading groups and discipleship, team unity and conflict, criticism and loneliness, spiritual warfare, one's own walk and family, and resting in God without burning out. You may offer a sermon or Bible-study outline with points and applications, but remind them to receive the word from God themselves first. Close with one small step for this week (a quiet hour with God, a caring phone call, an honest talk with a coworker). If extreme exhaustion, depression, wanting to quit or self-harm come up, respond gently and encourage reaching out at once to trusted coworkers, spiritual elders and professionals."}},"SKBG":{"zh":{"none":" 回答對象的信仰背景：沒有信仰。對方沒有特定宗教，可能從未接觸過聖經或教會。不預設他懂任何宗教詞彙，從他的生活處境與真實疑問出發；對信仰的好奇、猶豫或不確定都不評論對錯，用一個簡單的比喻說明，每次只講一個重點，不施壓、不催決志。 一律帶著尊重與愛心，不嘲笑任何信仰、不施壓；誠實而溫和地說明基督信仰的立場，並先回答他真正的問題。","buddhism":" 回答對象的信仰背景：佛教。請全程尊重，不貶低佛陀、佛教或他的修行，不用「拜偶像」「迷信」這類帶責備的字眼。先肯定共同關心的課題（苦、無常、慈悲、放下、心的平安），再溫和說明聖經的觀點：宇宙有位有位格的創造主，神主動愛人；救恩是白白的恩典，不是靠自己累積功德；人有一世的生命，死後要面對神，而不是輪迴。不要亂用佛教專有名詞；不確定他的宗派或想法時，先請他說說自己怎麼理解。 一律帶著尊重與愛心，不嘲笑任何信仰、不施壓；誠實而溫和地說明基督信仰的立場，並先回答他真正的問題。","folk":" 回答對象的信仰背景：民間信仰（拜拜、祭祖、神明、媽祖、風水、算命等）。請尊重他對家人、祖先與神明的敬重與孝心，不嘲笑、不恐嚇。先肯定聖經本來就教導孝敬父母，再溫和說明：敬拜只歸給創造天地的獨一真神；並關心他拜拜背後真正的需要，像是平安、保佑、被關愛、對未來的不安。用生活化的例子，回答他實際的疑惑（例如祭祖與追思的差別），不要要求他立刻改變家人的習慣。 一律帶著尊重與愛心，不嘲笑任何信仰、不施壓；誠實而溫和地說明基督信仰的立場，並先回答他真正的問題。","yiguandao":" 回答對象的信仰背景：一貫道。請尊重他吃素、重倫理道德、修身行善的認真，不批評他的師尊、道場或儀式。他多半敬畏「天」或「上帝」，也聽過「五教同源、萬教歸一」，可以從這份對天的敬畏與向善的心談起。對一貫道的教義細節（如無極老母、三期末劫、道場規矩）不要自己推斷或批評；不確定時請他說說自己的理解。再溫和、誠實地說明聖經的核心：神是有位格的創造主，藉著耶穌基督主動來到人間；耶穌說：「我就是道路、真理、生命」（約翰福音 14:6），救恩是白白的恩典。 一律帶著尊重與愛心，不嘲笑任何信仰、不施壓；誠實而溫和地說明基督信仰的立場，並先回答他真正的問題。","muslim":" 回答對象的信仰背景：穆斯林。請以最大的敬意對待他的信仰、古蘭經與先知，不辱罵、不嘲諷、不貶低，也不要用施壓或「勸你改教」的口氣；他可能要為此付出家庭與社群的代價，要體貼。先肯定共同點：信獨一的神，也尊敬亞伯拉罕、摩西、大衛，以及童女所生的先知爾薩（耶穌）。只引用聖經，說明聖經如何看耶穌（神的道成了肉身，是神的兒子），並清楚說明基督徒信的是獨一真神，不是三個神；也溫和比較「靠行為得救」與「靠恩典得救」的不同。避免用豬肉、酒、圖像這類容易冒犯的比喻。不確定他的教派或想法時，先請他分享。 一律帶著尊重與愛心，不嘲笑任何信仰、不施壓；誠實而溫和地說明基督信仰的立場，並先回答他真正的問題。","atheist":" 回答對象的信仰背景：無神論者。請尊重他靠理性、證據與誠實思考的態度，不說教，不說「你只要相信就好」。不把無神論說成稻草人，也不說科學與信仰一定對立。誠實承認哪些質疑很有力（如苦難、惡、宗教歷史上的錯誤），哪些事無法用科學證明，不誇大也不迴避；可以從道德直覺、生命的意義、宇宙的秩序與耶穌的歷史記載談起，引用聖經時也說明它的背景。語氣平等、好奇、不防衛，邀請他一起探索，而不是要他認輸。 一律帶著尊重與愛心，不嘲笑任何信仰、不施壓；誠實而溫和地說明基督信仰的立場，並先回答他真正的問題。"},"zs":{"none":" 回答对象的信仰背景：没有信仰。对方没有特定宗教，可能从未接触过圣经或教会。不预设他懂任何宗教词汇，从他的生活处境与真实疑问出发；对信仰的好奇、犹豫或不确定都不评论对错，用一个简单的比喻说明，每次只讲一个重点，不施压、不催决志。 一律带着尊重与爱心，不嘲笑任何信仰、不施压；诚实而温和地说明基督信仰的立场，并先回答他真正的问题。","buddhism":" 回答对象的信仰背景：佛教。请全程尊重，不贬低佛陀、佛教或他的修行，不用“拜偶像”“迷信”这类带责备的字眼。先肯定共同关心的课题（苦、无常、慈悲、放下、心的平安），再温和说明圣经的观点：宇宙有位有位格的创造主，神主动爱人；救恩是白白的恩典，不是靠自己累积功德；人有一世的生命，死后要面对神，而不是轮回。不要乱用佛教专有名词；不确定他的宗派或想法时，先请他说说自己怎么理解。 一律带着尊重与爱心，不嘲笑任何信仰、不施压；诚实而温和地说明基督信仰的立场，并先回答他真正的问题。","folk":" 回答对象的信仰背景：民间信仰（拜拜、祭祖、神明、妈祖、风水、算命等）。请尊重他对家人、祖先与神明的敬重与孝心，不嘲笑、不恐吓。先肯定圣经本来就教导孝敬父母，再温和说明：敬拜只归给创造天地的独一真神；并关心他拜拜背后真正的需要，像是平安、保佑、被关爱、对未来的不安。用生活化的例子，回答他实际的疑惑（例如祭祖与追思的差别），不要要求他立刻改变家人的习惯。 一律带着尊重与爱心，不嘲笑任何信仰、不施压；诚实而温和地说明基督信仰的立场，并先回答他真正的问题。","yiguandao":" 回答对象的信仰背景：一贯道。请尊重他吃素、重伦理道德、修身行善的认真，不批评他的师尊、道场或仪式。他多半敬畏“天”或“上帝”，也听过“五教同源、万教归一”，可以从这份对天的敬畏与向善的心谈起。对一贯道的教义细节（如无极老母、三期末劫、道场规矩）不要自己推断或批评；不确定时请他说说自己的理解。再温和、诚实地说明圣经的核心：神是有位格的创造主，借着耶稣基督主动来到人间；耶稣说：“我就是道路、真理、生命”（约翰福音 14:6），救恩是白白的恩典。 一律带着尊重与爱心，不嘲笑任何信仰、不施压；诚实而温和地说明基督信仰的立场，并先回答他真正的问题。","muslim":" 回答对象的信仰背景：穆斯林。请以最大的敬意对待他的信仰、古兰经与先知，不辱骂、不嘲讽、不贬低，也不要用施压或“劝你改教”的口气；他可能要为此付出家庭与社群的代价，要体贴。先肯定共同点：信独一的神，也尊敬亚伯拉罕、摩西、大卫，以及童女所生的先知尔萨（耶稣）。只引用圣经，说明圣经如何看耶稣（神的道成了肉身，是神的儿子），并清楚说明基督徒信的是独一真神，不是三个神；也温和比较“靠行为得救”与“靠恩典得救”的不同。避免用猪肉、酒、图像这类容易冒犯的比喻。不确定他的教派或想法时，先请他分享。 一律带着尊重与爱心，不嘲笑任何信仰、不施压；诚实而温和地说明基督信仰的立场，并先回答他真正的问题。","atheist":" 回答对象的信仰背景：无神论者。请尊重他靠理性、证据与诚实思考的态度，不说教，不说“你只要相信就好”。不把无神论说成稻草人，也不说科学与信仰一定对立。诚实承认哪些质疑很有力（如苦难、恶、宗教历史上的错误），哪些事无法用科学证明，不夸大也不回避；可以从道德直觉、生命的意义、宇宙的秩序与耶稣的历史记载谈起，引用圣经时也说明他的背景。语气平等、好奇、不防卫，邀请他一起探索，而不是要他认输。 一律带着尊重与爱心，不嘲笑任何信仰、不施压；诚实而温和地说明基督信仰的立场，并先回答他真正的问题。"},"en":{"none":" The seeker's faith background: no religious faith. They follow no particular religion and may never have met the Bible or a church. Assume no religious vocabulary; start from their real life situation and questions. Never judge curiosity, hesitation or uncertainty; explain with one simple picture, one main point at a time, with no pressure and no rush to decide. Always speak with respect and love, never mock any belief, never put them under pressure; state Christian convictions honestly but gently, and answer their actual question first.","buddhism":" The seeker's faith background: Buddhism. Be respectful throughout; never belittle the Buddha, Buddhism or their practice, and avoid accusing words such as 'idolatry' or 'superstition'. First affirm what you share — suffering, impermanence, compassion, letting go, peace of heart — then gently explain the Bible's view: a personal Creator who takes the initiative to love people; salvation as a free gift of grace, not merit we accumulate; one life, then facing God, rather than rebirth. Do not misuse Buddhist terms; if unsure of their school or understanding, ask them to share it first. Always speak with respect and love, never mock any belief, never put them under pressure; state Christian convictions honestly but gently, and answer their actual question first.","folk":" The seeker's faith background: folk religion (temple offerings, ancestor rites, local deities such as Mazu, feng shui, fortune-telling). Honour their respect for family, ancestors and the gods, and their filial devotion; never mock or frighten. First affirm that the Bible itself teaches honouring parents, then gently explain that worship belongs to the one true God who made heaven and earth; care about the real need behind the offerings — peace, protection, being loved, anxiety about the future. Use everyday examples, answer their practical questions (for example, ancestor rites versus remembrance), and do not ask them to change the family's customs at once. Always speak with respect and love, never mock any belief, never put them under pressure; state Christian convictions honestly but gently, and answer their actual question first.","yiguandao":" The seeker's faith background: Yiguandao (Way of Pervading Unity). Respect their vegetarianism, their seriousness about ethics and self-cultivation, and their good deeds; never criticise their teachers, halls or rituals. They typically revere Heaven or the Supreme Lord and have heard 'five religions share one source'; begin from that reverence and desire to do good. Do not guess at or criticise doctrinal details (such as the Eternal Mother, the three ages, hall rules); if unsure, ask them to explain their understanding. Then, gently and honestly, state the Bible's heart: a personal Creator who came to us in Jesus Christ; Jesus said, 'I am the way, the truth and the life' (John 14:6); salvation is a free gift of grace. Always speak with respect and love, never mock any belief, never put them under pressure; state Christian convictions honestly but gently, and answer their actual question first.","muslim":" The seeker's faith background: Muslim. Treat their faith, the Qur'an and the Prophet with the highest respect; never insult, mock or belittle, and never press or urge them to convert — they may pay a heavy price in family and community, so be considerate. First affirm common ground: belief in one God, and respect for Abraham, Moses, David and the virgin-born prophet Isa (Jesus). Quote only the Bible, explain how it sees Jesus (the Word made flesh, the Son of God), make clear that Christians worship the one true God, not three gods, and gently contrast salvation by works with salvation by grace. Avoid illustrations involving pork, alcohol or images that easily offend. If unsure of their tradition or views, ask them to share first. Always speak with respect and love, never mock any belief, never put them under pressure; state Christian convictions honestly but gently, and answer their actual question first.","atheist":" The seeker's faith background: atheist. Respect their reliance on reason, evidence and honest thinking; do not preach or say 'just believe'. Do not caricature atheism or claim science and faith must be at war. Honestly admit which objections are strong (suffering, evil, historical failures of religion) and which things science cannot prove, without exaggerating or dodging; you may start from moral intuition, meaning, the order of the universe and the historical records of Jesus, and explain the background when you cite the Bible. Keep the tone equal, curious and undefensive, inviting them to explore together rather than to concede. Always speak with respect and love, never mock any belief, never put them under pressure; state Christian convictions honestly but gently, and answer their actual question first."}},"LEN":{"zh":{"xs":" 回答長度：極短。整段回答控制在 100 字內：只給核心答案、一節關鍵經文、一句邀請讀者自己向神開口的話；不用標題、表格與清單。","s":" 回答長度：短。約 200～300 字：直接回答，加一節關鍵經文或一個比喻，最後給一個小步驟；不用表格、不列長清單。","mid":" 回答長度：中。約 500～600 字：依序說明經文脈絡、重點、清楚的321應用、這星期一個具體步驟，最後以一小段「引導禱告」邀請讀者自己禱告（不替讀者禱告）。","long":" 回答長度：長。約 1000～1200 字：可用簡短小標題，包含經文脈絡、關鍵字詞的意思、相關經文對照、清楚的321應用、這星期的具體步驟，最後以一小段「引導禱告」邀請讀者自己禱告（不替讀者禱告）。","xl":" 回答長度：極長。2000 字以上，不超過 3000 字。分段並用小標題，依序為：背景、段落分析、關鍵字詞、經文對照、神學重點、321應用、討論題、引導禱告。"},"zs":{"xs":" 回答长度：极短。整段回答控制在 100 字内：只给核心答案、一节关键经文、一句邀请读者自己向神开口的话；不用标题、表格与清单。","s":" 回答长度：短。约 200～300 字：直接回答，加一节关键经文或一个比喻，最后给一个小步骤；不用表格、不列长清单。","mid":" 回答长度：中。约 500～600 字：依序说明经文脉络、重点、清楚的321应用、这星期一个具体步骤，最后以一小段“引导祷告”邀请读者自己祷告（不替读者祷告）。","long":" 回答长度：长。约 1000～1200 字：可用简短小标题，包含经文脉络、关键字词的意思、相关经文对照、清楚的321应用、这星期的具体步骤，最后以一小段“引导祷告”邀请读者自己祷告（不替读者祷告）。","xl":" 回答长度：极长。2000 字以上，不超过 3000 字。分段并用小标题，依序为：背景、段落分析、关键字词、经文对照、神学重点、321应用、讨论题、引导祷告。"},"en":{"xs":" Length: VERY SHORT. The whole answer must stay within about 60 words: the core answer, one key verse, and a one-line invitation to pray. No headings, tables or lists.","s":" Length: SHORT. About 120–180 words: answer directly, add one key verse or one picture, and end with one small step. No tables or long lists.","mid":" Length: MEDIUM. About 300–350 words: the pas `;
  function css() {

  }
  function pfBtnText() { return '👤 ' + (pfNick() || L3('我的資料', '我的资料', 'About me')) + (pfAny() ? ' ✓' : ''); }
  function controlsInner(o) {

<div class="xz2-body" ${UI.open ? '' : 'hidden'}>
  <div class="xz2-bar">
    <button type="button" class="xz2-chip" data-xz2audtog onclick="XZ2.act('audtog')">${D.AUD_ICON[a]} ${esc(L3('對象：', '对象：', 'For: ') + X.audName(a))} ▾</button>
    <button type="button" class="xz2-chip" data-xz2pf onclick="XZ2.act('pf')">${esc(pfBtnText())}</button>
    <button type="button" class="xz2-chip" data-xz2pfnext title="switch" onclick="XZ2.act('pfnext')" ${pfList().length < 2 ? 'hidden' : ''}>🔄</button>
    ${qsBtn}
  </div>
  <div class="xz2-panel" ${UI.audOpen ? '' : 'hidden'}><div class="xz2-seg">${audGridHtml('aud')}</div><div class="xz2-hint">${esc(X.audHint(a))}</div></div>
  <div class="xz2-seg xz2-lenseg" style="margin:0 0 6px">${lenSegHtml()}</div>
  <div class="xz2-seg xz2-bgseg" style="margin:0 0 6px" ${a === 'seeker' ? '' : 'hidden'}>${bgSegHtml('bg')}</div>

  X.mountControls = (el, o) => { css(); o = o || {}; X._cOpt = o; el.className = (el.className ? el.className + ' ' : '') + 'xz2c'; el.setAttribute('data-xz2c', ''); el.innerHTML = controlsInner(o); return el; };

<div class="xz2-row"><div class="xz2-lab">${esc(L3('讀者資料', '读者资料', 'About me'))}<div class="xz2-hint">${esc(L3('暱稱、年齡、身分、就職、在學、信仰——讓小智量身回答', '昵称、年龄、身份、就职、在学、信仰——让小智量身回答', 'Nickname, age, status, work, study, faith — so Xiaozhi tailors answers'))}</div></div>
<div class="xz2-seg"><button type="button" class="xz2-chip" id="setProfile" onclick="XZ2.act('pf')">${esc(pfBtnText().replace('我的資料', L3('設定', '设置', 'Set up')).replace('我的资料', '设置').replace('About me', 'Set up'))}</button></div></div>

  /* 往上滑看回答時自動收起：傳入會捲動的元素（或 window） */
  X.watchScroll = (sel) => {
    let touch = 0, last = 0;
    const isT = t => { if (!sel) return t === document || t === document.documentElement || t === document.body; if (typeof sel === 'string') return !!(t && t.matches && t.matches(sel)); return t === sel; };
    const mark = () => { touch = Date.now(); };
    document.addEventListener('touchmove', mark, { passive: true, capture: true }); document.addEventListener('wheel', mark, { passive: true, capture: true });
    document.addEventListener('scroll', e => {
      const t = e.target; if (!isT(t)) return;

  X.act = (n, a) => {

      const tone = ['gentle', 'direct'].map(k => `<button type="button" class="${p.tone === k ? 'on' : ''}" data-k="${k}">${esc(k === 'gentle' ? L3('溫柔鼓勵', '温柔鼓励', 'Gentle & encouraging') : L3('直接挑戰', '直接挑战', 'Direct & challenging'))}</button>`).join('');
      m.innerHTML = `<div class="xz2-pfbox">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">👤 ${esc(L3('讀者資料（小智量身回答）', '读者资料（小智量身回答）', 'About me (personalised answers)'))}</b><button type="button" id="pfX" class="xz2-chip" style="padding:4px 12px">✕</button></div>

      <div class="xz2-note" style="margin-top:8px">${esc(L3('全部選填，只存在這支手機；小智回答時會把這些資料一併傳給 AI 服務，讓答案更貼近你。想停用隨時清除。', '全部选填，只存在这部手机；小智回答时会把这些资料一并传给 AI 服务，让答案更贴近你。想停用随时清除。', 'All optional and stored only on this phone. When Xiaozhi answers, these details are sent along to the AI service so the answer fits you. Clear them any time.'))}</div>
      <div class="xz2-fl">${esc(L3('暱稱', '昵称', 'Nickname'))}</div>
      <input id="pfNick" class="xz2-in" maxlength="20" value="${esc(p.nick || '')}">
      <div class="xz2-fl">${esc(L3('年齡', '年龄', 'Age'))}</div>

      : `${PF_FIELDS.map(sg).join('')}${pfSeeking(p) ? sg(pfRelField()) : ''}
      <div class="xz2-fl">${esc(L3('目前最想得到幫助的事（選填）', '目前最想得到帮助的事（选填）', 'What I most want help with now (optional)'))}</div>

      <div class="xz2-fl">${esc(L3('語氣偏好', '语气偏好', 'Tone'))}</div>

      <div class="xz2-note" style="margin-top:10px">${esc(L3('依你的資料，建議的回答對象：', '依你的资料，建议的回答对象：', 'Suggested answer audience: '))}${D.AUD_ICON[sa]} ${esc(X.audName(sa))} <button type="button" class="xz2-chip" id="pfApplyAud" style="padding:3px 10px;margin-left:6px">${esc(L3('套用', '套用', 'Apply'))}</button></div>

      const grab = () => {
        const n1 = $('#pfNick'); if (n1) p.nick = n1.value.trim();
